<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="眠迹" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>眠迹</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f7;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-solid: #ffffff;
        --surface-muted: #f2f2f7;
        --ink: #111114;
        --muted: #6e6e73;
        --line: rgba(60, 60, 67, 0.14);
        --blue: #007aff;
        --green: #34c759;
        --orange: #ff9f0a;
        --red: #ff3b30;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
        --soft-shadow: 0 10px 26px rgba(0, 0, 0, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 20% -10%, rgba(0, 122, 255, 0.12), transparent 24rem),
          linear-gradient(180deg, #fbfbfd 0%, var(--bg) 50%, #ececf1 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 46px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        touch-action: manipulation;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 48px;
        border: 1px solid rgba(60, 60, 67, 0.1);
        border-radius: 8px;
        background: rgba(247, 247, 250, 0.86);
        color: var(--ink);
        padding: 12px;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      textarea {
        resize: vertical;
        line-height: 1.5;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        border-color: rgba(0, 122, 255, 0.55);
        box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.14);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .app-shell {
        width: min(100%, 430px);
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
      }

      .topbar,
      .section-title,
      .time-grid,
      .metrics,
      .action-row,
      .bottom-nav,
      .history-item,
      .report-score,
      .chart-head {
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        gap: 14px;
        padding: 8px 2px 18px;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      h1 {
        margin-top: 3px;
        font-size: 34px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      h2 {
        font-size: 21px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      h3 {
        font-size: 16px;
        line-height: 1.25;
      }

      .score-pill {
        min-width: 88px;
        padding: 10px 11px;
        border: 1px solid rgba(0, 122, 255, 0.16);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(239, 247, 255, 0.82));
        box-shadow: var(--soft-shadow);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .score-pill strong {
        display: block;
        font-size: 21px;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }

      .score-pill span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 16px;
        backdrop-filter: blur(22px);
      }

      .panel + .panel,
      .chart-card,
      .report-card {
        margin-top: 12px;
      }

      .hidden {
        display: none;
      }

      .section-title {
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      #recordDate {
        width: 142px;
        min-height: 44px;
        background: #fff;
      }

      .time-grid {
        gap: 10px;
      }

      .time-card {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 9px;
        padding: 12px;
        border: 1px solid rgba(60, 60, 67, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .time-card input {
        min-height: 52px;
        border-color: rgba(60, 60, 67, 0.08);
        background: rgba(248, 249, 252, 0.92);
        text-align: center;
        font-size: 19px;
        font-weight: 500;
      }

      .time-card span,
      .field-block > label,
      .field-block > span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
      }

      .field-block {
        display: grid;
        gap: 8px;
        margin-top: 13px;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .exercise-row {
        display: grid;
        grid-template-columns: 1fr 92px;
        gap: 10px;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      .primary-btn,
      .ghost-btn {
        padding: 0 15px;
        font-weight: 800;
      }

      .primary-btn {
        grid-column: 1 / -1;
        background: var(--blue);
        color: #fff;
      }

      .ghost-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--blue);
      }

      .ghost-btn.danger {
        color: var(--red);
      }

      .report-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 15px;
      }

      .report-score {
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .ring {
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: conic-gradient(var(--blue) calc(var(--score, 0) * 1%), #e5e5ea 0);
        color: var(--ink);
        font-size: 18px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .ring::before {
        content: "";
        position: absolute;
      }

      .report-copy {
        display: grid;
        gap: 8px;
        color: #2b2b30;
        line-height: 1.55;
        font-size: 14px;
      }

      .report-copy ul {
        margin: 0;
        padding-left: 18px;
      }

      .metrics {
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }

      .metrics div {
        flex: 1;
        min-height: 76px;
        padding: 12px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .metrics strong,
      .metrics span {
        display: block;
      }

      .metrics strong {
        font-size: 20px;
        font-variant-numeric: tabular-nums;
      }

      .metrics span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .chart-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .chart-head {
        justify-content: space-between;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      .history-list {
        display: grid;
        gap: 10px;
      }

      .history-item {
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .history-item strong {
        display: block;
        margin-bottom: 5px;
      }

      .history-item p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .history-meta {
        flex-shrink: 0;
        display: grid;
        justify-items: end;
        gap: 4px;
        color: var(--blue);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .empty {
        padding: 30px 14px;
        color: var(--muted);
        text-align: center;
      }

      .bottom-nav {
        position: fixed;
        right: 50%;
        bottom: 0;
        z-index: 10;
        width: min(100%, 430px);
        transform: translateX(50%);
        justify-content: space-around;
        gap: 8px;
        padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: rgba(251, 251, 253, 0.82);
        backdrop-filter: blur(22px);
      }

      .nav-btn {
        flex: 1;
        display: grid;
        place-items: center;
        gap: 3px;
        min-height: 52px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .nav-btn.active {
        background: rgba(0, 122, 255, 0.12);
        color: var(--blue);
      }

      .nav-btn svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(88px + env(safe-area-inset-bottom));
        z-index: 20;
        max-width: min(90vw, 360px);
        padding: 12px 16px;
        border-radius: 8px;
        background: rgba(25, 25, 28, 0.92);
        color: #fff;
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 380px) {
        .app-shell {
          padding-inline: 11px;
        }

        .panel {
          padding: 14px;
        }

        .time-grid,
        .two-col,
        .exercise-row {
          display: grid;
          grid-template-columns: 1fr;
        }

        #recordDate {
          width: 132px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="今日概览">
        <div>
          <p class="eyebrow" id="todayLabel">今天</p>
          <h1>眠迹</h1>
        </div>
        <div class="score-pill">
          <strong id="sleepDuration">--</strong>
          <span>本次睡眠</span>
        </div>
      </section>

      <section class="panel" data-view="today">
        <div class="section-title">
          <div>
            <p class="eyebrow">睡眠记录</p>
            <h2 id="recordDateTitle">今天</h2>
          </div>
          <input id="recordDate" type="date" aria-label="选择日期" />
        </div>

        <div class="time-grid">
          <label class="time-card">
            <span>入睡</span>
            <input id="sleepTime" type="time" />
          </label>
          <label class="time-card">
            <span>起床</span>
            <input id="wakeTime" type="time" />
          </label>
        </div>

        <div class="two-col">
          <label class="field-block">
            <span>心情</span>
            <select id="mood">
              <option value="">未选择</option>
              <option>很好</option>
              <option>平静</option>
              <option>一般</option>
              <option>疲惫</option>
              <option>焦虑</option>
            </select>
          </label>
          <label class="field-block">
            <span>咖啡因 mg</span>
            <input id="caffeine" type="number" min="0" step="1" placeholder="毫克" inputmode="numeric" />
          </label>
        </div>
        <p class="hint">例：一杯美式约 80-150mg 咖啡因。</p>

        <div class="field-block">
          <label for="exerciseType">运动</label>
          <div class="exercise-row">
            <input id="exerciseType" type="text" placeholder="散步、跑步、力量训练" />
            <input id="exerciseMinutes" type="number" min="0" step="5" placeholder="分钟" inputmode="numeric" />
          </div>
        </div>

        <label class="field-block">
          <span>备注</span>
          <textarea id="notes" rows="3" placeholder="今天有什么影响睡眠的事？"></textarea>
        </label>

        <div class="action-row">
          <button class="primary-btn" id="saveBtn" type="button">保存并生成报告</button>
          <button class="ghost-btn" id="quickSleepBtn" type="button">现在入睡</button>
          <button class="ghost-btn" id="quickWakeBtn" type="button">现在起床</button>
        </div>
      </section>

      <section class="report-card" id="reportCard" aria-label="睡眠报告"></section>

      <section class="panel hidden" data-view="trend">
        <div class="section-title">
          <div>
            <p class="eyebrow">健康趋势</p>
            <h2>最近 14 天</h2>
          </div>
          <button class="ghost-btn danger" id="clearBtn" type="button">清空</button>
        </div>

        <div class="metrics">
          <div>
            <strong id="avgSleep">--</strong>
            <span>平均睡眠</span>
          </div>
          <div>
            <strong id="avgCaffeine">--</strong>
            <span>平均咖啡因</span>
          </div>
          <div>
            <strong id="exerciseDays">--</strong>
            <span>运动天数</span>
          </div>
        </div>

        <article class="chart-card">
          <div class="chart-head">
            <h3>睡眠时长</h3>
            <span>小时</span>
          </div>
          <canvas id="sleepChart" width="640" height="300"></canvas>
        </article>

        <article class="chart-card">
          <div class="chart-head">
            <h3>咖啡因摄入</h3>
            <span>mg</span>
          </div>
          <canvas id="caffeineChart" width="640" height="300"></canvas>
        </article>
      </section>

      <section class="panel hidden" data-view="history">
        <div class="section-title">
          <div>
            <p class="eyebrow">历史记录</p>
            <h2>所有日子</h2>
          </div>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

      <nav class="bottom-nav" aria-label="页面切换">
        <button class="nav-btn active" type="button" data-target="today" aria-label="今天">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v3M16 2v3M3.5 9.2h17M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
          <span>今天</span>
        </button>
        <button class="nav-btn" type="button" data-target="trend" aria-label="趋势">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 4-5 4 3 6-8M4 20h16"/></svg>
          <span>趋势</span>
        </button>
        <button class="nav-btn" type="button" data-target="history" aria-label="历史">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>历史</span>
        </button>
      </nav>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "mianji.sleep.records.v3";
      const PREVIOUS_KEY = "mianji.sleep.records.v2";
      const LEGACY_KEY = "mianji.sleep.records.v1";
      const today = new Date();
      const dateInput = document.querySelector("#recordDate");
      const recordDateTitle = document.querySelector("#recordDateTitle");
      const todayLabel = document.querySelector("#todayLabel");
      const sleepInput = document.querySelector("#sleepTime");
      const wakeInput = document.querySelector("#wakeTime");
      const moodInput = document.querySelector("#mood");
      const caffeineInput = document.querySelector("#caffeine");
      const exerciseTypeInput = document.querySelector("#exerciseType");
      const exerciseMinutesInput = document.querySelector("#exerciseMinutes");
      const notesInput = document.querySelector("#notes");
      const durationEl = document.querySelector("#sleepDuration");
      const toastEl = document.querySelector("#toast");
      const historyList = document.querySelector("#historyList");
      const reportCard = document.querySelector("#reportCard");

      const moodScore = {
        很好: 5,
        平静: 4,
        一般: 3,
        疲惫: 2,
        焦虑: 1,
      };

      let records = loadRecords();

      function toDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function formatDay(dateKey) {
        const date = new Date(`${dateKey}T12:00:00`);
        return new Intl.DateTimeFormat("zh-CN", {
          month: "long",
          day: "numeric",
          weekday: "short",
        }).format(date);
      }

      function loadRecords() {
        try {
          const current = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (current) return current;
          const previous = JSON.parse(localStorage.getItem(PREVIOUS_KEY)) || {};
          const converted = {};
          Object.entries(previous).forEach(([key, record]) => {
            converted[key] = {
              ...record,
              caffeine: caffeineToMg(record.caffeine),
            };
          });
          if (Object.keys(converted).length) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(converted));
            return converted;
          }
          const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)) || {};
          const migrated = {};
          Object.entries(legacy).forEach(([key, record]) => {
            migrated[key] = {
              ...record,
              caffeine: caffeineToMg(record.caffeine ?? cupsToCaffeine(record.coffee)),
            };
          });
          if (Object.keys(migrated).length) localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        } catch {
          return {};
        }
      }

      function persistRecords() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function cupsToCaffeine(cups) {
        const value = Number(cups || 0);
        return value ? Math.round(value * 100) : 0;
      }

      function caffeineToMg(value) {
        const amount = Number(value || 0);
        if (!Number.isFinite(amount) || amount <= 0) return 0;
        return amount <= 2 ? Math.round(amount * 1000) : Math.round(amount);
      }

      function nowTime() {
        const date = new Date();
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function toMinutes(value) {
        if (!value) return null;
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      }

      function sleepHours(sleepTime, wakeTime) {
        const start = toMinutes(sleepTime);
        const end = toMinutes(wakeTime);
        if (start === null || end === null) return null;
        const minutes = end >= start ? end - start : 1440 - start + end;
        return minutes / 60;
      }

      function formatHours(value) {
        if (value === null || Number.isNaN(value)) return "--";
        const hours = Math.floor(value);
        const minutes = Math.round((value - hours) * 60);
        return `${hours}时${minutes ? `${minutes}分` : ""}`;
      }

      function numberOrZero(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function fillForm(dateKey) {
        const record = records[dateKey] || {};
        recordDateTitle.textContent = formatDay(dateKey);
        sleepInput.value = record.sleepTime || "";
        wakeInput.value = record.wakeTime || "";
        moodInput.value = record.mood || "";
        caffeineInput.value = record.caffeine ?? "";
        exerciseTypeInput.value = record.exerciseType || "";
        exerciseMinutesInput.value = record.exerciseMinutes ?? "";
        notesInput.value = record.notes || "";
        updateDuration();
        updateReport();
      }

      function collectForm() {
        return {
          date: dateInput.value,
          sleepTime: sleepInput.value,
          wakeTime: wakeInput.value,
          mood: moodInput.value,
          caffeine: numberOrZero(caffeineInput.value),
          exerciseType: exerciseTypeInput.value.trim(),
          exerciseMinutes: numberOrZero(exerciseMinutesInput.value),
          notes: notesInput.value.trim(),
          updatedAt: new Date().toISOString(),
        };
      }

      function updateDuration() {
        durationEl.textContent = formatHours(sleepHours(sleepInput.value, wakeInput.value));
      }

      function saveRecord(quiet = false) {
        const record = collectForm();
        if (!record.sleepTime && !record.wakeTime && !record.mood && !record.notes && !record.caffeine && !record.exerciseType && !record.exerciseMinutes) {
          showToast("还没有填写内容");
          return;
        }
        records[record.date] = record;
        persistRecords();
        updateAllViews();
        if (!quiet) showToast("已生成睡眠报告");
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 1800);
      }

      function recentDays(count) {
        return Array.from({ length: count }, (_, index) => {
          const date = new Date();
          date.setDate(today.getDate() - (count - 1 - index));
          return toDateKey(date);
        });
      }

      function buildReport(record) {
        const hours = sleepHours(record.sleepTime, record.wakeTime);
        if (hours === null) {
          return {
            score: 0,
            title: "等待完整记录",
            summary: "填进入睡和起床时间后，我会根据睡眠时长、心情、咖啡因和运动生成一份简短报告。",
            tips: ["今晚先把时间记录完整，连续记录 7 天后趋势会更有参考价值。"],
          };
        }

        let score = 70;
        const tips = [];
        if (hours >= 7 && hours <= 9) score += 14;
        if (hours < 6) {
          score -= 18;
          tips.push("睡眠时长偏短，今晚可以把上床时间提前 30 分钟。");
        } else if (hours > 9.5) {
          score -= 6;
          tips.push("睡眠时长偏长，如果醒来仍疲惫，可以观察是否睡眠质量不稳。");
        } else {
          tips.push("睡眠时长比较理想，建议保持相近的入睡和起床节奏。");
        }

        const caffeine = Number(record.caffeine || 0);
        if (caffeine > 200) {
          score -= 12;
          tips.push("咖啡因超过 200mg，尽量把咖啡安排在下午早些时候之前。");
        } else if (caffeine > 80) {
          score -= 5;
          tips.push("咖啡因摄入不算高，但如果入睡困难，可以继续下调一点。");
        } else {
          score += 4;
          tips.push("咖啡因压力较低，对入睡更友好。");
        }

        const exerciseMinutes = Number(record.exerciseMinutes || 0);
        if (exerciseMinutes >= 20 && exerciseMinutes <= 80) {
          score += 8;
          tips.push(`${record.exerciseType || "运动"} ${exerciseMinutes} 分钟是加分项，规律运动通常有助于睡眠。`);
        } else if (exerciseMinutes > 80) {
          score -= 4;
          tips.push("运动量较大，尽量避免临睡前进行高强度训练。");
        } else if (exerciseMinutes === 0) {
          tips.push("明天可以加入 15-30 分钟轻运动，比如散步。");
        }

        if (record.mood) {
          const moodValue = moodScore[record.mood] || 3;
          score += (moodValue - 3) * 4;
          if (moodValue <= 2) tips.push("心情状态偏紧，睡前可以留 10 分钟做放松或写下明天要处理的事。");
        }

        score = Math.max(15, Math.min(100, Math.round(score)));
        const title = score >= 85 ? "恢复感很好" : score >= 70 ? "整体稳定" : score >= 55 ? "有优化空间" : "需要温和调整";
        const exerciseText = record.exerciseType
          ? `${record.exerciseType}${exerciseMinutes ? ` ${exerciseMinutes} 分钟` : ""}`
          : "未记录运动";
        const summary = `本次睡眠 ${formatHours(hours)}，咖啡因 ${Math.round(caffeine)}mg，${exerciseText}，心情${record.mood || "未选择"}。`;
        return { score, title, summary, tips: tips.slice(0, 3) };
      }

      function updateReport() {
        const record = records[dateInput.value] || collectForm();
        const report = buildReport(record);
        reportCard.innerHTML = `
          <div class="report-score">
            <div>
              <p class="eyebrow">睡眠报告</p>
              <h2>${report.title}</h2>
            </div>
            <div class="ring" style="--score: ${report.score}">${report.score || "--"}</div>
          </div>
          <div class="report-copy">
            <p>${report.summary}</p>
            <ul>${report.tips.map((tip) => `<li>${tip}</li>`).join("")}</ul>
          </div>
        `;
      }

      function updateStats() {
        const days = recentDays(14);
        const recentRecords = days.map((day) => records[day]).filter(Boolean);
        const durations = recentRecords.map((record) => sleepHours(record.sleepTime, record.wakeTime)).filter((value) => value !== null);
        const caffeineValues = recentRecords.map((record) => Number(record.caffeine || 0));
        const avgSleep = durations.length ? durations.reduce((sum, value) => sum + value, 0) / durations.length : null;
        const avgCaffeine = caffeineValues.length ? caffeineValues.reduce((sum, value) => sum + value, 0) / caffeineValues.length : null;
        const exerciseDays = recentRecords.filter((record) => Number(record.exerciseMinutes || 0) > 0 || record.exerciseType).length;
        document.querySelector("#avgSleep").textContent = avgSleep === null ? "--" : formatHours(avgSleep);
        document.querySelector("#avgCaffeine").textContent = avgCaffeine === null ? "--" : `${Math.round(avgCaffeine)}mg`;
        document.querySelector("#exerciseDays").textContent = `${exerciseDays}天`;
      }

      function drawLineChart(canvas, series, options) {
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;
        const pad = 34;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        const maxValue = Math.max(options.max || 0, ...series.flatMap((item) => item.values.map((point) => point.value || 0)), 1);
        ctx.strokeStyle = "#e5e5ea";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i += 1) {
          const y = pad + ((height - pad * 2) / 4) * i;
          ctx.beginPath();
          ctx.moveTo(pad, y);
          ctx.lineTo(width - 12, y);
          ctx.stroke();
        }
        series.forEach((item) => {
          ctx.strokeStyle = item.color;
          ctx.fillStyle = item.color;
          ctx.lineWidth = 4;
          ctx.beginPath();
          item.values.forEach((point, index) => {
            const x = pad + ((width - pad - 18) / Math.max(item.values.length - 1, 1)) * index;
            const y = height - pad - ((point.value || 0) / maxValue) * (height - pad * 2);
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
          item.values.forEach((point, index) => {
            const x = pad + ((width - pad - 18) / Math.max(item.values.length - 1, 1)) * index;
            const y = height - pad - ((point.value || 0) / maxValue) * (height - pad * 2);
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
          });
        });
        ctx.fillStyle = "#6e6e73";
        ctx.font = "20px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "center";
        options.labels.forEach((label, index) => {
          if (index % 3 !== 0 && index !== options.labels.length - 1) return;
          const rawX = pad + ((width - pad - 18) / Math.max(options.labels.length - 1, 1)) * index;
          const x = Math.min(Math.max(rawX, 34), width - 34);
          ctx.fillText(label, x, height - 8);
        });
        ctx.textAlign = "start";
      }

      function updateCharts() {
        const days = recentDays(14);
        const labels = days.map((day) => day.slice(5).replace("-", "/"));
        const sleepValues = days.map((day) => ({ value: sleepHours(records[day]?.sleepTime, records[day]?.wakeTime) || 0 }));
        const caffeineValues = days.map((day) => ({ value: Number(records[day]?.caffeine || 0) }));
        drawLineChart(document.querySelector("#sleepChart"), [{ color: "#007aff", values: sleepValues }], { labels, max: 10 });
        drawLineChart(document.querySelector("#caffeineChart"), [{ color: "#ff9f0a", values: caffeineValues }], { labels, max: 400 });
      }

      function updateHistory() {
        const items = Object.values(records).sort((a, b) => b.date.localeCompare(a.date));
        if (!items.length) {
          historyList.innerHTML = `<div class="empty">还没有记录。今天先填一条就好。</div>`;
          return;
        }
        historyList.innerHTML = items
          .map((record) => {
            const duration = formatHours(sleepHours(record.sleepTime, record.wakeTime));
            const report = buildReport(record);
            const extras = [
              record.mood ? `心情：${record.mood}` : "",
              record.caffeine ? `咖啡因：${Math.round(Number(record.caffeine))}mg` : "",
              record.exerciseType ? `运动：${record.exerciseType}${record.exerciseMinutes ? ` ${record.exerciseMinutes}分钟` : ""}` : "",
              `评分：${report.score}`,
            ]
              .filter(Boolean)
              .join(" · ");
            return `
              <article class="history-item">
                <div>
                  <strong>${formatDay(record.date)}</strong>
                  <p>${extras}</p>
                </div>
                <div class="history-meta">
                  <span>${duration}</span>
                  <small>${record.sleepTime || "--"} - ${record.wakeTime || "--"}</small>
                </div>
              </article>
            `;
          })
          .join("");
      }

      function updateAllViews() {
        updateDuration();
        updateReport();
        updateStats();
        updateCharts();
        updateHistory();
      }

      document.querySelector("#saveBtn").addEventListener("click", () => saveRecord());
      document.querySelector("#quickSleepBtn").addEventListener("click", () => {
        sleepInput.value = nowTime();
        saveRecord(true);
        showToast("已填入当前入睡时间");
      });
      document.querySelector("#quickWakeBtn").addEventListener("click", () => {
        wakeInput.value = nowTime();
        saveRecord(true);
        showToast("已填入当前起床时间");
      });

      [sleepInput, wakeInput, moodInput, caffeineInput, exerciseTypeInput, exerciseMinutesInput].forEach((input) => {
        input.addEventListener("input", () => {
          updateDuration();
          updateReport();
        });
      });

      dateInput.addEventListener("change", () => fillForm(dateInput.value));

      document.querySelectorAll(".nav-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.target;
          document.querySelectorAll(".panel").forEach((panel) => panel.classList.toggle("hidden", panel.dataset.view !== target));
          reportCard.classList.toggle("hidden", target !== "today");
          document.querySelectorAll(".nav-btn").forEach((navButton) => navButton.classList.toggle("active", navButton === button));
          updateAllViews();
        });
      });

      document.querySelector("#clearBtn").addEventListener("click", () => {
        const confirmed = window.confirm("确认清空所有记录吗？这个操作不能恢复。");
        if (!confirmed) return;
        records = {};
        persistRecords();
        fillForm(dateInput.value);
        updateAllViews();
        showToast("已清空");
      });

      dateInput.value = toDateKey(today);
      todayLabel.textContent = new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long",
      }).format(today);
      fillForm(dateInput.value);
      updateAllViews();
    </script>
  </body>
</html>
