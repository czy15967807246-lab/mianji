<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#D0E6FD" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="眠迹" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>眠迹</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #D0E6FD;
        --surface: rgba(255, 255, 255, 0.97);
        --surface-solid: #ffffff;
        --surface-muted: #F7FBFF;
        --ink: #162660;
        --muted: rgba(22, 38, 96, 0.68);
        --line: rgba(22, 38, 96, 0.14);
        --blue: #162660;
        --green: #162660;
        --green-dark: #0F1B4A;
        --green-soft: #D0E6FD;
        --yellow: #D0E6FD;
        --orange: #162660;
        --red: #B64242;
        --shadow: 0 14px 34px rgba(22, 38, 96, 0.12);
        --soft-shadow: 0 8px 22px rgba(22, 38, 96, 0.1);
        --press-shadow: 0 4px 0 #0F1B4A;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 12% -10%, rgba(255, 255, 255, 0.7), transparent 18rem),
          radial-gradient(circle at 100% 5%, rgba(22, 38, 96, 0.12), transparent 16rem),
          linear-gradient(180deg, #FFFFFF 0%, var(--bg) 58%, #BFD9F4 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 46px;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      button:active {
        transform: translateY(3px);
        box-shadow: none;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 48px;
        border: 1px solid rgba(22, 38, 96, 0.16);
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--ink);
        padding: 12px;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      textarea {
        resize: vertical;
        line-height: 1.5;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        border-color: rgba(22, 38, 96, 0.72);
        box-shadow: 0 0 0 4px rgba(208, 230, 253, 0.8);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .app-shell {
        width: min(100%, 430px);
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
      }

      .topbar,
      .section-title,
      .time-grid,
      .metrics,
      .action-row,
      .bottom-nav,
      .history-item,
      .report-score,
      .chart-head,
      .feedback-toggle,
      .overview-head,
      .history-top {
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        gap: 14px;
        padding: 8px 2px 14px;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border: 1px solid rgba(22, 38, 96, 0.16);
        border-radius: 8px;
        background: #162660;
        box-shadow: none;
        flex-shrink: 0;
        display: block;
      }

      .brand-mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      h1 {
        margin-top: 3px;
        font-size: 32px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      h2 {
        font-size: 21px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      h3 {
        font-size: 16px;
        line-height: 1.25;
      }

      .score-pill {
        min-width: 88px;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: var(--soft-shadow);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .score-pill strong {
        display: block;
        font-size: 21px;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }

      .score-pill span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .overview-card {
        margin-bottom: 12px;
        padding: 16px;
        border: 1px solid rgba(22, 38, 96, 0.14);
        border-radius: 8px;
        background:
          radial-gradient(circle at 96% 0%, rgba(208, 230, 253, 0.9), transparent 8rem),
          linear-gradient(180deg, #FFFFFF, #F4FAFF);
        box-shadow: var(--shadow);
      }

      .overview-head {
        justify-content: space-between;
        gap: 14px;
      }

      .score-ring {
        flex-shrink: 0;
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: conic-gradient(var(--blue) calc(var(--score, 0) * 1%), rgba(208, 230, 253, 0.82) 0);
        box-shadow: var(--soft-shadow);
      }

      .score-ring-inner {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: #ffffff;
        border: 1px solid rgba(22, 38, 96, 0.12);
        font-size: 25px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .overview-copy {
        min-width: 0;
      }

      .overview-copy h2 {
        margin-top: 4px;
        font-size: 24px;
      }

      .overview-copy p {
        margin-top: 8px;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.45;
      }

      .overview-delta {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        margin-top: 8px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
      }

      .overview-delta.down {
        background: #FFFFFF;
        color: #c7362f;
      }

      .overview-chips,
      .history-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid rgba(22, 38, 96, 0.12);
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 750;
      }

      .feedback-toggle {
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(22, 38, 96, 0.12);
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .feedback-toggle button {
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(22, 38, 96, 0.14);
        background: #ffffff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 850;
        box-shadow: var(--soft-shadow);
      }

      .panel + .panel,
      .chart-card,
      .report-card {
        margin-top: 12px;
      }

      .hidden {
        display: none;
      }

      .section-title {
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      #recordDate {
        width: 142px;
        min-height: 44px;
        background: #fff;
        border-color: var(--line);
      }

      .time-grid {
        display: none;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      .time-card {
        min-width: 0;
        display: grid;
        gap: 9px;
        padding: 12px;
        border: 1px solid rgba(22, 38, 96, 0.12);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: var(--soft-shadow);
        overflow: hidden;
      }

      .time-card input {
        display: block;
        min-width: 0;
        max-width: 100%;
        min-height: 52px;
        padding: 10px 6px;
        border-color: rgba(22, 38, 96, 0.12);
        background: #FFFFFF;
        text-align: center;
        font-size: 17px;
        font-weight: 500;
        -webkit-appearance: none;
        appearance: none;
      }

      .time-card span,
      .field-block > label,
      .field-block > span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .field-block {
        display: grid;
        gap: 8px;
        margin-top: 13px;
      }

      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      .exercise-row {
        display: grid;
        grid-template-columns: 1fr 92px;
        gap: 10px;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .delay-card {
        margin-top: 13px;
        padding: 14px;
        border: 1px solid rgba(22, 38, 96, 0.14);
        border-radius: 8px;
        background: linear-gradient(180deg, #F7FBFF, #FFFFFF);
        box-shadow: var(--soft-shadow);
      }

      .delay-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .delay-head span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .delay-head small {
        color: var(--muted);
        font-size: 12px;
      }

      .delay-options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .delay-btn,
      .custom-delay button {
        min-height: 42px;
        border: 1px solid rgba(22, 38, 96, 0.18);
        background: #ffffff;
        color: var(--ink);
        font-weight: 850;
        box-shadow: 0 3px 0 rgba(22, 38, 96, 0.12);
      }

      .custom-delay {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px;
        gap: 8px;
        margin-top: 8px;
      }

      .custom-delay input {
        min-height: 42px;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      .primary-btn,
      .ghost-btn {
        padding: 0 15px;
        font-weight: 900;
      }

      .primary-btn {
        border-color: var(--green-dark);
        background: var(--green);
        color: #fff;
        box-shadow: var(--press-shadow);
      }

      .ghost-btn {
        border: 1px solid rgba(22, 38, 96, 0.14);
        background: #fff;
        color: var(--blue);
        box-shadow: var(--soft-shadow);
      }

      .ghost-btn.danger {
        color: var(--red);
      }

      .report-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 15px;
        box-shadow: var(--soft-shadow);
      }

      .report-score {
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .ring {
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: conic-gradient(var(--blue) calc(var(--score, 0) * 1%), rgba(208, 230, 253, 0.86) 0);
        color: var(--ink);
        font-size: 18px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .ring::before {
        content: "";
        position: absolute;
      }

      .report-copy {
        display: grid;
        gap: 8px;
        color: var(--ink);
        line-height: 1.55;
        font-size: 14px;
      }

      .report-copy ul {
        margin: 0;
        padding-left: 18px;
      }

      .metrics {
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }

      .metrics div {
        flex: 1;
        min-height: 76px;
        padding: 12px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--soft-shadow);
      }

      .metrics strong,
      .metrics span {
        display: block;
      }

      .metrics strong {
        font-size: 20px;
        font-variant-numeric: tabular-nums;
      }

      .metrics span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .chart-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--soft-shadow);
      }

      .chart-head {
        justify-content: space-between;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      .history-list {
        display: grid;
        gap: 10px;
      }

      .history-item {
        display: block;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--soft-shadow);
      }

      .history-top {
        justify-content: space-between;
        gap: 12px;
      }

      .history-date strong {
        display: block;
        margin-bottom: 4px;
        font-size: 16px;
      }

      .history-date small,
      .history-note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .history-note {
        margin-top: 10px;
      }

      .history-meta {
        flex-shrink: 0;
        display: grid;
        justify-items: end;
        gap: 4px;
        color: var(--blue);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .score-badge {
        display: grid;
        place-items: center;
        min-width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--green-soft);
        color: var(--green-dark);
        font-size: 16px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .empty {
        padding: 30px 14px;
        color: var(--muted);
        text-align: center;
      }

      .bottom-nav {
        position: fixed;
        right: 50%;
        bottom: 0;
        z-index: 10;
        width: min(100%, 430px);
        transform: translateX(50%);
        justify-content: space-around;
        gap: 8px;
        padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(18px);
      }

      .nav-btn {
        flex: 1;
        display: grid;
        place-items: center;
        gap: 3px;
        min-height: 52px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .nav-btn.active {
        background: var(--green-soft);
        color: var(--green-dark);
        box-shadow: inset 0 -3px 0 rgba(22, 38, 96, 0.18);
      }

      .nav-btn svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(88px + env(safe-area-inset-bottom));
        z-index: 20;
        max-width: min(90vw, 360px);
        padding: 12px 16px;
        border-radius: 8px;
        background: rgba(31, 73, 13, 0.94);
        color: #fff;
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 380px) {
        .app-shell {
          padding-inline: 11px;
        }

        .panel {
          padding: 14px;
        }

        .overview-head {
          align-items: flex-start;
        }

        .score-ring {
          width: 82px;
          height: 82px;
        }

        .score-ring-inner {
          width: 64px;
          height: 64px;
          font-size: 22px;
        }

        .two-col,
        .exercise-row {
          display: grid;
          grid-template-columns: 1fr;
        }

        .delay-options {
          grid-template-columns: 1fr;
        }

        #recordDate {
          width: 132px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="今日概览">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <rect width="64" height="64" rx="15" fill="#162660"/>
              <path d="M0 42c7 1.4 12 4.7 17.1 9.6 5.5 5.3 11.7 7 19.9 6.4 9.4-.8 15.7-6.6 23.5-9.2 1.2-.4 2.4-.8 3.5-.9V64H0z" fill="#4E72BA"/>
              <g transform="translate(7 5) scale(0.82)">
                <path d="M20.3 21c-.8-7 0-12.3 2.3-14.5 2.6-2.6 6.9-.3 11.1 5.4 4.8-2 9.7-1.9 14.4.2 4.7-5.8 9.3-8 11.9-5.3 2.2 2.3 3.1 7.6 2.1 14.3 2.7 2.8 4.2 6.7 4 11.3l-.2 6.9c-.1 1.3-1 2.4-2.3 2.7-1.3.3-2.6-.4-3.2-1.6-3.2-6.2-8.1-9.6-14.3-9.9-6.8-.3-13.5 3.5-17.6 10-2.3 3.6-3.2 7.5-2.7 11.3.8 5.3 4.3 8.6 10.1 9.8 5.3 1.1 9.3.3 12.1-2.3 2.1-1.9 2.9-4.4 2.4-7.3-.6-3.1-3.1-5.4-8.1-7.3-4.4-1.8-6.8-4.1-7-7-.1-2.9 1.8-5.3 5.1-6.3 3.4-1 6.4 0 9.1 3 2.6 2.9 4.5 6.6 5.7 11.2 1.3 5.1 1 9.6-.9 13.3-2.9 5.5-8.9 8.6-17 8.7-8.9.2-16.2-2.7-21.9-8.6-5.3-5.4-8.1-12.2-7.9-19.6l.2-6c.1-4.3 1.6-8.1 4.4-11.3zm4.4-1 5.8-3.9c-2.4-3.4-4.4-5.2-6.2-5.5-.6 2-.6 5.1-.3 9.3.3 0 .5.1.7.1zm27.5-3.9 5.9 4c.4-4.2.3-7.4-.3-9.4-1.8.3-3.8 2.1-5.6 5.4z" fill="#FFFFFF"/>
                <g fill="#162660">
                  <ellipse cx="22.4" cy="25.6" rx="3.4" ry="4.6"/>
                  <ellipse cx="41.6" cy="25.6" rx="3.4" ry="4.6"/>
                  <ellipse cx="32" cy="20.2" rx="3.9" ry="5.3"/>
                </g>
              </g>
            </svg>
          </div>
          <div>
            <p class="eyebrow" id="todayLabel">今天</p>
            <h1>眠迹</h1>
          </div>
        </div>
        <div class="score-pill">
          <strong id="sleepDuration">--</strong>
          <span>本次睡眠</span>
        </div>
      </section>

      <section class="overview-card" id="overviewCard" aria-label="今日睡眠状态"></section>

      <section class="panel" data-view="today">
        <div class="section-title">
          <div>
            <p class="eyebrow">睡眠记录</p>
            <h2 id="recordDateTitle">今天</h2>
          </div>
          <input id="recordDate" type="date" aria-label="选择日期" />
        </div>

        <div class="time-grid">
          <label class="time-card">
            <span>入睡</span>
            <input id="sleepTime" type="time" />
          </label>
          <label class="time-card">
            <span>起床</span>
            <input id="wakeTime" type="time" />
          </label>
        </div>

        <div class="delay-card" aria-label="准备睡觉">
          <div class="delay-head">
            <span>准备睡觉</span>
            <small>按预计入睡时间填写</small>
          </div>
          <div class="delay-options">
            <button class="delay-btn" type="button" data-delay="10">10 分钟后</button>
            <button class="delay-btn" type="button" data-delay="15">15 分钟后</button>
            <button class="delay-btn" type="button" data-delay="20">20 分钟后</button>
          </div>
          <div class="custom-delay">
            <input id="customDelay" type="number" min="1" max="180" step="1" placeholder="自定分钟" inputmode="numeric" />
            <button id="customDelayBtn" type="button">填写</button>
          </div>
        </div>

        <div class="action-row">
          <button class="ghost-btn" id="quickWakeBtn" type="button">准备起床</button>
        </div>

        <div class="two-col">
          <label class="field-block">
            <span>心情</span>
            <select id="mood">
              <option value="">未选择</option>
              <option>很好</option>
              <option>平静</option>
              <option>一般</option>
              <option>疲惫</option>
              <option>焦虑</option>
            </select>
          </label>
          <label class="field-block">
            <span>咖啡因 mg</span>
            <input id="caffeine" type="number" min="0" step="1" placeholder="毫克" inputmode="numeric" />
          </label>
        </div>
        <p class="hint">例：一杯美式约 80-150mg 咖啡因。</p>

        <div class="field-block">
          <label for="exerciseType">运动</label>
          <div class="exercise-row">
            <input id="exerciseType" type="text" placeholder="散步、跑步、力量训练" />
            <input id="exerciseMinutes" type="number" min="0" step="5" placeholder="分钟" inputmode="numeric" />
          </div>
        </div>

        <label class="field-block">
          <span>备注</span>
          <textarea id="notes" rows="3" placeholder="今天有什么影响睡眠的事？"></textarea>
        </label>

        <div class="action-row">
          <button class="primary-btn" id="saveBtn" type="button">保存并生成报告</button>
        </div>
      </section>

      <section class="report-card" id="reportCard" aria-label="睡眠报告"></section>

      <section class="panel hidden" data-view="trend">
        <div class="section-title">
          <div>
            <p class="eyebrow">健康趋势</p>
            <h2>最近 14 天</h2>
          </div>
          <button class="ghost-btn danger" id="clearBtn" type="button">清空</button>
        </div>

        <div class="metrics">
          <div>
            <strong id="avgSleep">--</strong>
            <span>平均睡眠</span>
          </div>
          <div>
            <strong id="avgCaffeine">--</strong>
            <span>平均咖啡因</span>
          </div>
          <div>
            <strong id="exerciseDays">--</strong>
            <span>运动天数</span>
          </div>
        </div>

        <article class="chart-card">
          <div class="chart-head">
            <h3>睡眠时长</h3>
            <span>小时</span>
          </div>
          <canvas id="sleepChart" width="640" height="300"></canvas>
        </article>

        <article class="chart-card">
          <div class="chart-head">
            <h3>咖啡因摄入</h3>
            <span>mg</span>
          </div>
          <canvas id="caffeineChart" width="640" height="300"></canvas>
        </article>
      </section>

      <section class="panel hidden" data-view="history">
        <div class="section-title">
          <div>
            <p class="eyebrow">历史记录</p>
            <h2>所有日子</h2>
          </div>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

      <nav class="bottom-nav" aria-label="页面切换">
        <button class="nav-btn active" type="button" data-target="today" aria-label="今天">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v3M16 2v3M3.5 9.2h17M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
          <span>今天</span>
        </button>
        <button class="nav-btn" type="button" data-target="trend" aria-label="趋势">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 4-5 4 3 6-8M4 20h16"/></svg>
          <span>趋势</span>
        </button>
        <button class="nav-btn" type="button" data-target="history" aria-label="历史">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>历史</span>
        </button>
      </nav>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "mianji.sleep.records.v3";
      const PREVIOUS_KEY = "mianji.sleep.records.v2";
      const LEGACY_KEY = "mianji.sleep.records.v1";
      const today = new Date();
      const dateInput = document.querySelector("#recordDate");
      const recordDateTitle = document.querySelector("#recordDateTitle");
      const todayLabel = document.querySelector("#todayLabel");
      const sleepInput = document.querySelector("#sleepTime");
      const wakeInput = document.querySelector("#wakeTime");
      const moodInput = document.querySelector("#mood");
      const caffeineInput = document.querySelector("#caffeine");
      const exerciseTypeInput = document.querySelector("#exerciseType");
      const exerciseMinutesInput = document.querySelector("#exerciseMinutes");
      const notesInput = document.querySelector("#notes");
      const customDelayInput = document.querySelector("#customDelay");
      const durationEl = document.querySelector("#sleepDuration");
      const toastEl = document.querySelector("#toast");
      const historyList = document.querySelector("#historyList");
      const reportCard = document.querySelector("#reportCard");
      const overviewCard = document.querySelector("#overviewCard");
      const FEEDBACK_KEY = "mianji.feedback.enabled";
      let feedbackEnabled = localStorage.getItem(FEEDBACK_KEY) !== "off";
      let audioContext = null;

      const moodScore = {
        很好: 5,
        平静: 4,
        一般: 3,
        疲惫: 2,
        焦虑: 1,
      };

      let records = loadRecords();

      function toDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function formatDay(dateKey) {
        const date = new Date(`${dateKey}T12:00:00`);
        return new Intl.DateTimeFormat("zh-CN", {
          month: "long",
          day: "numeric",
          weekday: "short",
        }).format(date);
      }

      function loadRecords() {
        try {
          const current = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (current) return current;
          const previous = JSON.parse(localStorage.getItem(PREVIOUS_KEY)) || {};
          const converted = {};
          Object.entries(previous).forEach(([key, record]) => {
            converted[key] = {
              ...record,
              caffeine: caffeineToMg(record.caffeine),
            };
          });
          if (Object.keys(converted).length) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(converted));
            return converted;
          }
          const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)) || {};
          const migrated = {};
          Object.entries(legacy).forEach(([key, record]) => {
            migrated[key] = {
              ...record,
              caffeine: caffeineToMg(record.caffeine ?? cupsToCaffeine(record.coffee)),
            };
          });
          if (Object.keys(migrated).length) localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        } catch {
          return {};
        }
      }

      function persistRecords() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function cupsToCaffeine(cups) {
        const value = Number(cups || 0);
        return value ? Math.round(value * 100) : 0;
      }

      function caffeineToMg(value) {
        const amount = Number(value || 0);
        if (!Number.isFinite(amount) || amount <= 0) return 0;
        return amount <= 2 ? Math.round(amount * 1000) : Math.round(amount);
      }

      function nowTime() {
        const date = new Date();
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function timeAfterMinutes(minutes) {
        const date = new Date();
        date.setMinutes(date.getMinutes() + minutes);
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function timeLabel(value) {
        return value || "--";
      }

      function sleepTiming(startMinutes, endMinutes) {
        if (startMinutes === null || endMinutes === null) {
          return { type: "unknown", label: "时间未完整", penalty: 0, tip: "" };
        }
        if (startMinutes >= 300 && startMinutes < 720) {
          return {
            type: "day-sleep",
            label: "通宵后补觉",
            penalty: 22,
            tip: "这次像是通宵后的补觉：时长可以回血，但昼夜节律会被打乱。今天尽量晒点自然光，晚上不要再把入睡时间拖太晚。",
          };
        }
        if (startMinutes >= 120 && startMinutes < 300) {
          return {
            type: "late-night",
            label: "入睡偏晚",
            penalty: 10,
            tip: "入睡时间已经偏晚，身体可能睡够了但节律没完全跟上。明天可以先提前 20-30 分钟上床。",
          };
        }
        if (endMinutes >= 780 && endMinutes < 1080) {
          return {
            type: "late-wake",
            label: "起床偏晚",
            penalty: 8,
            tip: "起床时间偏晚，可能会影响今晚困意。下午尽量少睡长觉，给晚上的睡意留空间。",
          };
        }
        if (startMinutes >= 1260 || startMinutes < 90) {
          return {
            type: "night",
            label: "节律正常",
            penalty: -6,
            tip: "入睡时段比较友好，继续保持类似节奏会更容易看到分数进步。",
          };
        }
        return {
          type: "neutral",
          label: "节律可观察",
          penalty: 0,
          tip: "这次入睡时段不算极端，连续记录几天后再看趋势会更准。",
        };
      }

      function toMinutes(value) {
        if (!value) return null;
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      }

      function sleepHours(sleepTime, wakeTime) {
        const start = toMinutes(sleepTime);
        const end = toMinutes(wakeTime);
        if (start === null || end === null) return null;
        const minutes = end >= start ? end - start : 1440 - start + end;
        return minutes / 60;
      }

      function formatHours(value) {
        if (value === null || Number.isNaN(value)) return "--";
        const hours = Math.floor(value);
        const minutes = Math.round((value - hours) * 60);
        return `${hours}时${minutes ? `${minutes}分` : ""}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function numberOrBlank(value) {
        if (value === "") return "";
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : "";
      }

      function fillForm(dateKey) {
        const record = records[dateKey] || {};
        recordDateTitle.textContent = formatDay(dateKey);
        sleepInput.value = record.sleepTime || "";
        wakeInput.value = record.wakeTime || "";
        moodInput.value = record.mood || "";
        caffeineInput.value = record.caffeine ?? "";
        exerciseTypeInput.value = record.exerciseType || "";
        exerciseMinutesInput.value = record.exerciseMinutes ?? "";
        notesInput.value = record.notes || "";
        updateDuration();
        updateReport();
      }

      function collectForm() {
        return {
          date: dateInput.value,
          sleepTime: sleepInput.value,
          wakeTime: wakeInput.value,
          mood: moodInput.value,
          caffeine: numberOrBlank(caffeineInput.value),
          exerciseType: exerciseTypeInput.value.trim(),
          exerciseMinutes: numberOrBlank(exerciseMinutesInput.value),
          notes: notesInput.value.trim(),
          updatedAt: new Date().toISOString(),
        };
      }

      function updateDuration() {
        durationEl.textContent = formatHours(sleepHours(sleepInput.value, wakeInput.value));
      }

      function playTone(kind = "tap") {
        if (!feedbackEnabled) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const now = audioContext.currentTime;
          const notes = kind === "success" ? [523.25, 659.25, 783.99] : [440, 587.33];
          notes.forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0.0001, now + index * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.08, now + index * 0.06 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.06 + 0.14);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(now + index * 0.06);
            oscillator.stop(now + index * 0.06 + 0.16);
          });
        } catch {
          // 有些浏览器会限制网页音频，失败时安静跳过。
        }
      }

      function haptic(pattern = [12]) {
        if (!feedbackEnabled || !navigator.vibrate) return;
        navigator.vibrate(pattern);
      }

      function feedback(kind = "tap") {
        haptic(kind === "success" ? [12, 30, 18] : [10]);
        playTone(kind);
      }

      function toggleFeedback() {
        feedbackEnabled = !feedbackEnabled;
        localStorage.setItem(FEEDBACK_KEY, feedbackEnabled ? "on" : "off");
        feedback("tap");
        updateOverview();
        showToast(feedbackEnabled ? "声效反馈已开启" : "声效反馈已关闭");
      }

      function saveRecord(quiet = false) {
        const record = collectForm();
        if (!record.sleepTime && !record.wakeTime && !record.mood && !record.notes && !record.caffeine && !record.exerciseType && !record.exerciseMinutes) {
          showToast("还没有填写内容");
          return;
        }
        records[record.date] = record;
        persistRecords();
        updateAllViews();
        if (!quiet) {
          feedback("success");
          showToast("已生成睡眠报告");
        }
      }

      function setDelayedSleep(minutes) {
        const rawDelay = Number(minutes);
        if (!Number.isFinite(rawDelay) || rawDelay <= 0) {
          showToast("请输入有效分钟数");
          return;
        }
        const delay = Math.max(1, Math.min(180, Math.round(rawDelay)));
        sleepInput.value = timeAfterMinutes(delay);
        saveRecord(true);
        showToast(`已填入 ${delay} 分钟后的入睡时间`);
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 1800);
      }

      function recentDays(count) {
        return Array.from({ length: count }, (_, index) => {
          const date = new Date();
          date.setDate(today.getDate() - (count - 1 - index));
          return toDateKey(date);
        });
      }

      function previousRecord(dateKey) {
        return Object.values(records)
          .filter((record) => record.date < dateKey && sleepHours(record.sleepTime, record.wakeTime) !== null)
          .sort((a, b) => b.date.localeCompare(a.date))[0];
      }

      function buildReport(record, includeDelta = true) {
        const hours = sleepHours(record.sleepTime, record.wakeTime);
        const factors = [];
        if (hours === null) {
          return {
            score: 0,
            title: "等待完整记录",
            summary: "先完成今天记录：填进入睡和起床时间，我会帮你判断恢复、节律和影响因素。",
            tips: ["先记录一条就好，连续 7 天后就能看到自己的睡眠进步曲线。"],
            factors: ["未完成"],
          };
        }

        let score = 68;
        const tips = [];
        const startMinutes = toMinutes(record.sleepTime);
        const endMinutes = toMinutes(record.wakeTime);
        const timing = sleepTiming(startMinutes, endMinutes);
        score -= timing.penalty;
        factors.push(timing.label);
        if (timing.tip) tips.push(timing.tip);

        if (hours >= 7 && hours <= 9) {
          score += 18;
          factors.push("时长理想");
        }
        if (hours < 6) {
          score -= 18;
          factors.push("睡眠偏短");
          tips.push("这次睡眠时间偏短，今晚别急着追求完美，先把入睡窗口提前 30 分钟就够了。");
        } else if (hours > 9.5) {
          score -= 6;
          factors.push("睡眠偏长");
          tips.push("睡眠时长偏长，如果醒来仍疲惫，可以观察是否睡眠质量不稳。");
        } else {
          tips.push("睡眠时长达标，这次主要看节律、咖啡因和精神状态。");
        }

        const caffeine = Number(record.caffeine || 0);
        if (caffeine > 200) {
          score -= 12;
          factors.push("咖啡因偏高");
          tips.push("咖啡因超过 200mg，尽量把咖啡安排在下午早些时候之前。");
        } else if (caffeine > 80) {
          score -= 5;
          factors.push("咖啡因适中");
          tips.push("咖啡因摄入不算高，但如果入睡困难，可以继续下调一点。");
        } else if (caffeine > 0) {
          score += 4;
          factors.push("咖啡因较低");
          tips.push("咖啡因压力较低，对入睡更友好。");
        }

        const exerciseMinutes = Number(record.exerciseMinutes || 0);
        if (exerciseMinutes >= 20 && exerciseMinutes <= 80) {
          score += 8;
          factors.push("运动加分");
          tips.push(`${record.exerciseType || "运动"} ${exerciseMinutes} 分钟是加分项，规律运动通常有助于睡眠。`);
        } else if (exerciseMinutes > 80) {
          score -= 4;
          factors.push("运动偏多");
          tips.push("运动量较大，尽量避免临睡前进行高强度训练。");
        } else if (exerciseMinutes === 0) {
          tips.push("明天可以加入 15-30 分钟轻运动，比如散步。");
        }

        if (record.mood) {
          const moodValue = moodScore[record.mood] || 3;
          score += (moodValue - 3) * 4;
          factors.push(`心情${record.mood}`);
          if (moodValue <= 2) tips.push("心情状态偏紧，睡前可以留 10 分钟做放松或写下明天要处理的事。");
        }

        score = Math.max(15, Math.min(100, Math.round(score)));
        const prev = includeDelta ? previousRecord(record.date || dateInput.value) : null;
        let delta = null;
        if (prev) {
          const previousReport = buildReport({ ...prev, date: prev.date }, false);
          delta = score - previousReport.score;
          if (delta >= 5) tips.push(`比上一次高了 ${Math.round(delta)} 分，这次升级很明显，保留今天做对的部分。`);
          if (delta <= -8) tips.push("这次分数回落不代表失败，更像身体在提醒你：节律比单次睡眠时长更重要。");
        }

        const title =
          timing.type === "day-sleep"
            ? "像是通宵后的补觉"
            : score >= 85
              ? "恢复感很好"
              : score >= 70
                ? "整体稳定"
                : score >= 55
                  ? "有优化空间"
                  : "需要温和调整";
        const exerciseText = record.exerciseType
          ? `${record.exerciseType}${exerciseMinutes ? ` ${exerciseMinutes} 分钟` : ""}`
          : "未记录运动";
        const summary = `本次 ${timeLabel(record.sleepTime)} 到 ${timeLabel(record.wakeTime)}，睡了 ${formatHours(hours)}。${timing.type === "day-sleep" ? "时长不是问题，真正扣分的是通宵后的节律冲击。" : `咖啡因 ${Math.round(caffeine)}mg，${exerciseText}，心情${record.mood || "未选择"}。`}`;
        return { score, title, summary, tips: tips.slice(0, 4), factors: factors.slice(0, 4), delta };
      }

      function updateReport() {
        const record = records[dateInput.value] || collectForm();
        const report = buildReport(record);
        reportCard.innerHTML = `
          <div class="report-score">
            <div>
              <p class="eyebrow">睡眠报告</p>
              <h2>${escapeHtml(report.title)}</h2>
            </div>
            <div class="ring" style="--score: ${report.score}">${report.score || "--"}</div>
          </div>
          <div class="report-copy">
            <p>${escapeHtml(report.summary)}</p>
            <ul>${report.tips.map((tip) => `<li>${escapeHtml(tip)}</li>`).join("")}</ul>
          </div>
        `;
      }

      function updateOverview() {
        const record = records[dateInput.value] || collectForm();
        const report = buildReport(record);
        const deltaClass = report.delta < 0 ? " down" : "";
        const deltaText =
          report.delta == null
            ? "开始记录后会显示进步"
            : report.delta >= 0
              ? `比上次 +${Math.round(report.delta)}`
              : `比上次 ${Math.round(report.delta)}`;
        overviewCard.innerHTML = `
          <div class="overview-head">
            <div class="overview-copy">
              <p class="eyebrow">今日进度</p>
              <h2>${escapeHtml(report.title)}</h2>
              <p>${escapeHtml(report.summary)}</p>
              <span class="overview-delta${deltaClass}">${escapeHtml(deltaText)}</span>
            </div>
            <div class="score-ring" style="--score: ${report.score}">
              <div class="score-ring-inner">${report.score || "--"}</div>
            </div>
          </div>
          <div class="overview-chips">
            ${(report.factors || []).map((factor) => `<span class="chip">${escapeHtml(factor)}</span>`).join("")}
          </div>
          <div class="feedback-toggle">
            <span>声效反馈${navigator.vibrate ? "" : "，此设备可能不支持网页震动"}</span>
            <button id="feedbackToggle" type="button">${feedbackEnabled ? "已开启" : "已关闭"}</button>
          </div>
        `;
      }

      function updateStats() {
        const days = recentDays(14);
        const recentRecords = days.map((day) => records[day]).filter(Boolean);
        const durations = recentRecords.map((record) => sleepHours(record.sleepTime, record.wakeTime)).filter((value) => value !== null);
        const caffeineValues = recentRecords.map((record) => Number(record.caffeine || 0));
        const avgSleep = durations.length ? durations.reduce((sum, value) => sum + value, 0) / durations.length : null;
        const avgCaffeine = caffeineValues.length ? caffeineValues.reduce((sum, value) => sum + value, 0) / caffeineValues.length : null;
        const exerciseDays = recentRecords.filter((record) => Number(record.exerciseMinutes || 0) > 0 || record.exerciseType).length;
        document.querySelector("#avgSleep").textContent = avgSleep === null ? "--" : formatHours(avgSleep);
        document.querySelector("#avgCaffeine").textContent = avgCaffeine === null ? "--" : `${Math.round(avgCaffeine)}mg`;
        document.querySelector("#exerciseDays").textContent = `${exerciseDays}天`;
      }

      function drawLineChart(canvas, series, options) {
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;
        const pad = 34;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        const maxValue = Math.max(options.max || 0, ...series.flatMap((item) => item.values.map((point) => point.value || 0)), 1);
        ctx.strokeStyle = "#D0E6FD";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i += 1) {
          const y = pad + ((height - pad * 2) / 4) * i;
          ctx.beginPath();
          ctx.moveTo(pad, y);
          ctx.lineTo(width - 12, y);
          ctx.stroke();
        }
        series.forEach((item) => {
          ctx.strokeStyle = item.color;
          ctx.fillStyle = item.color;
          ctx.lineWidth = 4;
          ctx.beginPath();
          item.values.forEach((point, index) => {
            const x = pad + ((width - pad - 18) / Math.max(item.values.length - 1, 1)) * index;
            const y = height - pad - ((point.value || 0) / maxValue) * (height - pad * 2);
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
          item.values.forEach((point, index) => {
            const x = pad + ((width - pad - 18) / Math.max(item.values.length - 1, 1)) * index;
            const y = height - pad - ((point.value || 0) / maxValue) * (height - pad * 2);
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
          });
        });
        ctx.fillStyle = "#162660";
        ctx.font = "20px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "center";
        options.labels.forEach((label, index) => {
          if (index % 3 !== 0 && index !== options.labels.length - 1) return;
          const rawX = pad + ((width - pad - 18) / Math.max(options.labels.length - 1, 1)) * index;
          const x = Math.min(Math.max(rawX, 34), width - 34);
          ctx.fillText(label, x, height - 8);
        });
        ctx.textAlign = "start";
      }

      function updateCharts() {
        const days = recentDays(14);
        const labels = days.map((day) => day.slice(5).replace("-", "/"));
        const sleepValues = days.map((day) => ({ value: sleepHours(records[day]?.sleepTime, records[day]?.wakeTime) || 0 }));
        const caffeineValues = days.map((day) => ({ value: Number(records[day]?.caffeine || 0) }));
        drawLineChart(document.querySelector("#sleepChart"), [{ color: "#162660", values: sleepValues }], { labels, max: 10 });
        drawLineChart(document.querySelector("#caffeineChart"), [{ color: "#162660", values: caffeineValues }], { labels, max: 400 });
      }

      function updateHistory() {
        const items = Object.values(records).sort((a, b) => b.date.localeCompare(a.date));
        if (!items.length) {
          historyList.innerHTML = `<div class="empty">还没有记录。今天先填一条就好。</div>`;
          return;
        }
        historyList.innerHTML = items
          .map((record) => {
            const duration = formatHours(sleepHours(record.sleepTime, record.wakeTime));
            const report = buildReport(record);
            const chips = [
              duration !== "--" ? `睡眠 ${duration}` : "",
              record.mood ? record.mood : "",
              record.caffeine ? `${Math.round(Number(record.caffeine))}mg 咖啡因` : "",
              record.exerciseType ? `${record.exerciseType}${record.exerciseMinutes ? ` ${record.exerciseMinutes}分钟` : ""}` : "",
            ].filter(Boolean);
            return `
              <article class="history-item">
                <div class="history-top">
                  <div class="history-date">
                    <strong>${escapeHtml(formatDay(record.date))}</strong>
                    <small>${escapeHtml(timeLabel(record.sleepTime))} - ${escapeHtml(timeLabel(record.wakeTime))}</small>
                  </div>
                  <div class="score-badge">${report.score || "--"}</div>
                </div>
                <div class="history-chips">
                  ${chips.map((chip) => `<span class="chip">${escapeHtml(chip)}</span>`).join("")}
                </div>
                <p class="history-note">${escapeHtml(report.title)}：${escapeHtml(report.tips[0] || report.summary)}</p>
              </article>
            `;
          })
          .join("");
      }

      function updateAllViews() {
        updateDuration();
        updateOverview();
        updateReport();
        updateStats();
        updateCharts();
        updateHistory();
      }

      document.querySelector("#saveBtn").addEventListener("click", () => saveRecord());
      document.querySelector("#quickWakeBtn").addEventListener("click", () => {
        feedback("tap");
        wakeInput.value = nowTime();
        saveRecord(true);
        showToast("已填入起床时间");
      });

      document.querySelectorAll(".delay-btn").forEach((button) => {
        button.addEventListener("click", () => {
          feedback("tap");
          setDelayedSleep(button.dataset.delay);
        });
      });

      document.querySelector("#customDelayBtn").addEventListener("click", () => {
        feedback("tap");
        setDelayedSleep(customDelayInput.value);
      });

      overviewCard.addEventListener("click", (event) => {
        if (event.target.id === "feedbackToggle") toggleFeedback();
      });

      [sleepInput, wakeInput, moodInput, caffeineInput, exerciseTypeInput, exerciseMinutesInput].forEach((input) => {
        input.addEventListener("input", () => {
          updateDuration();
          updateReport();
        });
      });

      dateInput.addEventListener("change", () => fillForm(dateInput.value));

      document.querySelectorAll(".nav-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.target;
          document.querySelectorAll(".panel").forEach((panel) => panel.classList.toggle("hidden", panel.dataset.view !== target));
          reportCard.classList.toggle("hidden", target !== "today");
          document.querySelectorAll(".nav-btn").forEach((navButton) => navButton.classList.toggle("active", navButton === button));
          updateAllViews();
        });
      });

      document.querySelector("#clearBtn").addEventListener("click", () => {
        const confirmed = window.confirm("确认清空所有记录吗？这个操作不能恢复。");
        if (!confirmed) return;
        records = {};
        persistRecords();
        fillForm(dateInput.value);
        updateAllViews();
        showToast("已清空");
      });

      dateInput.value = toDateKey(today);
      todayLabel.textContent = new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long",
      }).format(today);
      fillForm(dateInput.value);
      updateAllViews();
    </script>
  </body>
</html>
