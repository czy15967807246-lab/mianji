<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#D0E6FD" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="眠迹" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>眠迹</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #D0E6FD;
        --surface: rgba(255, 255, 255, 0.97);
        --surface-solid: #ffffff;
        --surface-muted: #F7FBFF;
        --ink: #162660;
        --muted: rgba(22, 38, 96, 0.68);
        --line: rgba(22, 38, 96, 0.14);
        --blue: #162660;
        --green: #162660;
        --green-dark: #0F1B4A;
        --green-soft: #D0E6FD;
        --yellow: #D0E6FD;
        --orange: #162660;
        --red: #B64242;
        --shadow: 0 10px 26px rgba(22, 38, 96, 0.08);
        --soft-shadow: 0 4px 14px rgba(22, 38, 96, 0.07);
        --press-shadow: 0 4px 0 #0F1B4A;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 46px;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      button:active {
        transform: translateY(3px);
        box-shadow: none;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        min-height: 48px;
        border: 1px solid rgba(22, 38, 96, 0.16);
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--ink);
        padding: 12px;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }

      textarea {
        resize: vertical;
        line-height: 1.5;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        border-color: rgba(22, 38, 96, 0.72);
        box-shadow: 0 0 0 4px rgba(208, 230, 253, 0.8);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .app-shell {
        width: min(100%, 430px);
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
      }

      .topbar,
      .section-title,
      .time-grid,
      .metrics,
      .action-row,
      .bottom-nav,
      .history-item,
      .report-score,
      .chart-head,
      .feedback-toggle,
      .overview-head,
      .history-top {
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        gap: 14px;
        padding: 8px 2px 14px;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border: 1px solid rgba(22, 38, 96, 0.16);
        border-radius: 8px;
        background: #162660;
        box-shadow: none;
        flex-shrink: 0;
        display: block;
      }

      .brand-mark img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      h1 {
        margin-top: 3px;
        font-size: 32px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      h2 {
        font-size: 21px;
        line-height: 1.18;
        letter-spacing: 0;
      }

      h3 {
        font-size: 16px;
        line-height: 1.25;
      }

      .score-pill {
        min-width: 88px;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: var(--soft-shadow);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .score-pill strong {
        display: block;
        font-size: 21px;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }

      .score-pill span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .overview-card {
        margin-bottom: 12px;
        padding: 16px;
        border: 1px solid rgba(22, 38, 96, 0.14);
        border-radius: 8px;
        background:
          radial-gradient(circle at 96% 0%, rgba(208, 230, 253, 0.9), transparent 8rem),
          linear-gradient(180deg, #FFFFFF, #F4FAFF);
        box-shadow: var(--shadow);
      }

      .overview-head {
        justify-content: space-between;
        gap: 14px;
      }

      .score-ring {
        flex-shrink: 0;
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: conic-gradient(var(--blue) calc(var(--score, 0) * 1%), rgba(208, 230, 253, 0.82) 0);
        box-shadow: var(--soft-shadow);
      }

      .score-ring-inner {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: #ffffff;
        border: 1px solid rgba(22, 38, 96, 0.12);
        font-size: 25px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .overview-copy {
        min-width: 0;
      }

      .overview-copy h2 {
        margin-top: 4px;
        font-size: 24px;
      }

      .overview-copy p {
        margin-top: 8px;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.45;
      }

      .overview-delta {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        margin-top: 8px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
      }

      .overview-delta.down {
        background: #FFFFFF;
        color: #c7362f;
      }

      .overview-chips,
      .history-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid rgba(22, 38, 96, 0.12);
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 750;
      }

      .feedback-toggle {
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(22, 38, 96, 0.12);
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .feedback-toggle button {
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(22, 38, 96, 0.14);
        background: #ffffff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 850;
        box-shadow: var(--soft-shadow);
      }

      .panel + .panel,
      .chart-card,
      .report-card {
        margin-top: 12px;
      }

      .hidden {
        display: none !important;
      }

      .section-title {
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      #recordDate {
        width: 142px;
        min-height: 44px;
        background: #fff;
        border-color: var(--line);
      }

      .time-grid {
        display: none;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      .time-card {
        min-width: 0;
        display: grid;
        gap: 9px;
        padding: 12px;
        border: 1px solid rgba(22, 38, 96, 0.12);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: var(--soft-shadow);
        overflow: hidden;
      }

      .time-card input {
        display: block;
        min-width: 0;
        max-width: 100%;
        min-height: 52px;
        padding: 10px 6px;
        border-color: rgba(22, 38, 96, 0.12);
        background: #FFFFFF;
        text-align: center;
        font-size: 17px;
        font-weight: 500;
        -webkit-appearance: none;
        appearance: none;
      }

      .time-card span,
      .field-block > label,
      .field-block > span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .field-block {
        display: grid;
        gap: 8px;
        margin-top: 13px;
      }

      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      .exercise-row {
        display: grid;
        grid-template-columns: 1fr 92px;
        gap: 10px;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .quick-time-card {
        margin-top: 13px;
        padding: 14px;
        border: 1px solid rgba(22, 38, 96, 0.14);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: var(--soft-shadow);
      }

      .quick-time-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .quick-time-head span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .quick-time-head small {
        color: var(--muted);
        font-size: 12px;
      }

      .quick-time-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      .time-action-panel {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .time-action-btn {
        display: grid;
        gap: 5px;
        width: 100%;
        min-height: 90px;
        padding: 12px;
        border: 1px solid rgba(22, 38, 96, 0.18);
        background: #ffffff;
        color: var(--ink);
        text-align: left;
        box-shadow: 0 3px 0 rgba(22, 38, 96, 0.12);
      }

      .time-action-btn.is-primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #ffffff;
        text-align: center;
      }

      .time-action-btn.is-primary small {
        color: rgba(255, 255, 255, 0.72);
      }

      .time-complete-state {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-muted);
        text-align: center;
      }

      .time-complete-state strong,
      .time-complete-state span {
        display: block;
      }

      .time-complete-state span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .manual-time-details {
        margin-top: 10px;
        border-top: 1px solid var(--line);
      }

      .manual-time-details summary {
        padding-top: 12px;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
      }

      .manual-time-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .time-action-btn span {
        font-size: 17px;
        font-weight: 900;
      }

      .time-action-btn strong {
        font-size: 25px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .time-action-btn small {
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .optional-panel {
        padding: 0;
        overflow: hidden;
      }

      .optional-details summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 58px;
        padding: 0 16px;
        cursor: pointer;
        color: var(--ink);
        font-size: 15px;
        font-weight: 850;
        list-style: none;
      }

      .optional-details summary::-webkit-details-marker {
        display: none;
      }

      .optional-details summary::after {
        content: "+";
        color: var(--muted);
        font-size: 22px;
        font-weight: 500;
      }

      .optional-details[open] summary::after {
        content: "−";
      }

      .optional-details summary small {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .optional-content {
        padding: 0 16px 16px;
        border-top: 1px solid var(--line);
      }

      .manual-time {
        display: grid;
        gap: 6px;
      }

      .manual-time span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .manual-time input {
        min-height: 44px;
        background: #ffffff;
        border-color: rgba(22, 38, 96, 0.14);
        font-size: 18px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      .primary-btn,
      .ghost-btn {
        padding: 0 15px;
        font-weight: 900;
      }

      .primary-btn {
        border-color: var(--green-dark);
        background: var(--green);
        color: #fff;
        box-shadow: var(--press-shadow);
      }

      .ghost-btn {
        border: 1px solid rgba(22, 38, 96, 0.14);
        background: #fff;
        color: var(--blue);
        box-shadow: var(--soft-shadow);
      }

      .ghost-btn.danger {
        color: var(--red);
      }

      .report-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 15px;
        box-shadow: var(--soft-shadow);
      }

      .report-score {
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .ring {
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: conic-gradient(var(--blue) calc(var(--score, 0) * 1%), rgba(208, 230, 253, 0.86) 0);
        color: var(--ink);
        font-size: 18px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .ring::before {
        content: "";
        position: absolute;
      }

      .report-copy {
        display: grid;
        gap: 8px;
        color: var(--ink);
        line-height: 1.55;
        font-size: 14px;
      }

      .report-copy ul {
        margin: 0;
        padding-left: 18px;
      }

      .report-basis {
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .section-actions {
        display: flex;
        gap: 8px;
      }

      .section-actions button {
        min-height: 40px;
        padding-inline: 11px;
        font-size: 12px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .trend-note {
        margin: -4px 0 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-muted);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .metrics {
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }

      .metrics div {
        flex: 1;
        min-height: 76px;
        padding: 12px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--soft-shadow);
      }

      .metrics strong,
      .metrics span {
        display: block;
      }

      .metrics strong {
        font-size: 20px;
        font-variant-numeric: tabular-nums;
      }

      .metrics span {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .chart-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--soft-shadow);
      }

      .chart-head {
        justify-content: space-between;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      .history-list {
        display: grid;
        gap: 10px;
      }

      .history-item {
        display: block;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: var(--soft-shadow);
      }

      .history-top {
        justify-content: space-between;
        gap: 12px;
      }

      .history-date strong {
        display: block;
        margin-bottom: 4px;
        font-size: 16px;
      }

      .history-date small,
      .history-note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .history-note {
        margin-top: 10px;
      }

      .history-edit {
        min-height: 34px;
        margin-top: 10px;
        padding: 0 11px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
      }

      .history-filter {
        width: auto;
        min-width: 118px;
        min-height: 42px;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 750;
      }

      .chip.warning {
        border-color: rgba(182, 66, 66, 0.24);
        background: rgba(182, 66, 66, 0.08);
        color: var(--red);
      }

      .history-meta {
        flex-shrink: 0;
        display: grid;
        justify-items: end;
        gap: 4px;
        color: var(--blue);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .score-badge {
        display: grid;
        place-items: center;
        min-width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--green-soft);
        color: var(--green-dark);
        font-size: 16px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      .empty {
        padding: 30px 14px;
        color: var(--muted);
        text-align: center;
      }

      .bottom-nav {
        position: fixed;
        right: 50%;
        bottom: 0;
        z-index: 10;
        width: min(100%, 430px);
        transform: translateX(50%);
        justify-content: space-around;
        gap: 8px;
        padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(18px);
      }

      .nav-btn {
        flex: 1;
        display: grid;
        place-items: center;
        gap: 3px;
        min-height: 52px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .nav-btn.active {
        background: var(--green-soft);
        color: var(--green-dark);
        box-shadow: inset 0 -3px 0 rgba(22, 38, 96, 0.18);
      }

      .nav-btn svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(88px + env(safe-area-inset-bottom));
        z-index: 20;
        max-width: min(90vw, 360px);
        padding: 12px 16px;
        border-radius: 8px;
        background: rgba(31, 73, 13, 0.94);
        color: #fff;
        opacity: 0;
        transform: translate(-50%, 10px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 380px) {
        .app-shell {
          padding-inline: 11px;
        }

        .panel {
          padding: 14px;
        }

        .overview-head {
          align-items: flex-start;
        }

        .score-ring {
          width: 82px;
          height: 82px;
        }

        .score-ring-inner {
          width: 64px;
          height: 64px;
          font-size: 22px;
        }

        .two-col,
        .exercise-row {
          display: grid;
          grid-template-columns: 1fr;
        }

        .quick-time-actions {
          grid-template-columns: 1fr;
        }

        #recordDate {
          width: 132px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="今日概览">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <img src="./icon.svg" alt="" />
          </div>
          <div>
            <p class="eyebrow" id="todayLabel">今天</p>
            <h1>眠迹</h1>
          </div>
        </div>
        <div class="score-pill">
          <strong id="sleepDuration">--</strong>
          <span>本次睡眠</span>
        </div>
      </section>

      <section class="panel" data-view="today">
        <div class="section-title">
          <div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "mianji.sleep.records.v3";
      const PREVIOUS_KEY = "mianji.sleep.records.v2";
      const LEGACY_KEY = "mianji.sleep.records.v1";
      const today = new Date();
      const dateInput = document.querySelector("#recordDate");
      const recordDateTitle = document.querySelector("#recordDateTitle");
      const todayLabel = document.querySelector("#todayLabel");
      const sleepInput = document.querySelector("#sleepTime");
      const wakeInput = document.querySelector("#wakeTime");
      const moodInput = document.querySelector("#mood");
      const caffeineInput = document.querySelector("#caffeine");
      const exerciseTypeInput = document.querySelector("#exerciseType");
      const exerciseMinutesInput = document.querySelector("#exerciseMinutes");
      const saveStatusEl = document.querySelector("#saveStatus");
      const notesInput = document.querySelector("#notes");
      const sleepActionTime = document.querySelector("#sleepActionTime");
      const wakeActionTime = document.querySelector("#wakeActionTime");
      const sleepActionPanel = document.querySelector("#sleepActionPanel");
      const wakeActionPanel = document.querySelector("#wakeActionPanel");
      const timeCompleteState = document.querySelector("#timeCompleteState");
      const timeCompleteCopy = document.querySelector("#timeCompleteCopy");
      const actionHint = document.querySelector("#actionHint");
      const durationEl = document.querySelector("#sleepDuration");
      const toastEl = document.querySelector("#toast");
      const historyList = document.querySelector("#historyList");
      const historyMonth = document.querySelector("#historyMonth");
      const historyTitle = document.querySelector("#historyTitle");
      const reportCard = document.querySelector("#reportCard");
      const importInput = document.querySelector("#importInput");
      let feedbackEnabled = false;
      let audioContext = null;

      const moodScore = {
        很好: 5,
        平静: 4,
        一般: 3,
        疲惫: 2,
        焦虑: 1,
      };

      let records = loadRecords();
      let autoSaveTimer;

      function toDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function formatDay(dateKey) {
        const date = new Date(`${dateKey}T12:00:00`);
        return new Intl.DateTimeFormat("zh-CN", {
          month: "long",
          day: "numeric",
          weekday: "short",
        }).format(date);
      }

      function addDays(dateKey, count) {
        const date = new Date(`${dateKey}T12:00:00`);
        date.setDate(date.getDate() + count);
        return toDateKey(date);
      }

      function wakeDateFor(record) {
        if (!record?.date || !record.sleepTime || !record.wakeTime) return record?.date || "";
        if (record.wakeDate) return record.wakeDate;
        return toMinutes(record.wakeTime) < toMinutes(record.sleepTime) ? addDays(record.date, 1) : record.date;
      }

      function loadRecords() {
        try {
          const current = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (current) return current;
          const previous = JSON.parse(localStorage.getItem(PREVIOUS_KEY)) || {};
          const converted = {};
          Object.entries(previous).forEach(([key, record]) => {
            converted[key] = {
              ...record,
              caffeine: caffeineToMg(record.caffeine),
            };
          });
          if (Object.keys(converted).length) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(converted));
            return converted;
          }
          const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)) || {};
          const migrated = {};
          Object.entries(legacy).forEach(([key, record]) => {
            migrated[key] = {
              ...record,
              caffeine: caffeineToMg(record.caffeine ?? cupsToCaffeine(record.coffee)),
            };
          });
          if (Object.keys(migrated).length) localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        } catch {
          return {};
        }
      }

      function persistRecords() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function exportRecords() {
        const payload = {
          app: "眠迹",
          version: 3,
          exportedAt: new Date().toISOString(),
          records,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `眠迹备份-${toDateKey(new Date())}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        showToast("备份已导出");
      }

      function normalizeImportedRecords(payload) {
        const source = payload?.records;
        if (!source || typeof source !== "object" || Array.isArray(source)) throw new Error("invalid records");
        const normalized = {};
        Object.entries(source).forEach(([key, value]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !value || typeof value !== "object" || Array.isArray(value)) return;
          const sleepTime = /^\d{2}:\d{2}$/.test(value.sleepTime || "") ? value.sleepTime : "";
          const wakeTime = /^\d{2}:\d{2}$/.test(value.wakeTime || "") ? value.wakeTime : "";
          const record = {
            date: key,
            sleepTime,
            wakeTime,
            mood: String(value.mood || "").slice(0, 20),
            caffeine: numberOrBlank(value.caffeine),
            exerciseType: String(value.exerciseType || "").slice(0, 80),
            exerciseMinutes: numberOrBlank(value.exerciseMinutes),
            notes: String(value.notes || "").slice(0, 2000),
            updatedAt: typeof value.updatedAt === "string" ? value.updatedAt : new Date().toISOString(),
          };
          record.wakeDate = wakeDateFor(record);
          normalized[key] = record;
        });
        if (!Object.keys(normalized).length) throw new Error("empty records");
        return normalized;
      }

      async function importRecords(file) {
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          showToast("备份文件过大，无法导入");
          return;
        }
        try {
          const incoming = normalizeImportedRecords(JSON.parse(await file.text()));
          const incomingDates = Object.keys(incoming);
          const conflicts = incomingDates.filter((date) => records[date]);
          if (conflicts.length && !window.confirm(`备份中有 ${conflicts.length} 天与现有记录重复。继续后以备份内容为准，其他日期不受影响。`)) return;
          records = { ...records, ...incoming };
          persistRecords();
          fillForm(dateInput.value);
          updateAllViews();
          showToast(`已恢复 ${incomingDates.length} 天记录`);
        } catch {
          showToast("无法识别这个备份文件");
        } finally {
          importInput.value = "";
        }
      }

      function cupsToCaffeine(cups) {
        const value = Number(cups || 0);
        return value ? Math.round(value * 100) : 0;
      }

      function caffeineToMg(value) {
        const amount = Number(value || 0);
        if (!Number.isFinite(amount) || amount <= 0) return 0;
        return amount <= 2 ? Math.round(amount * 1000) : Math.round(amount);
      }

      function nowTime() {
        const date = new Date();
        return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function timeLabel(value) {
        return value || "--";
      }

      function sleepTiming(startMinutes, endMinutes) {
        if (startMinutes === null || endMinutes === null) {
          return { type: "unknown", label: "时间未完整", penalty: 0, tip: "" };
        }
        if (startMinutes >= 300 && startMinutes < 720) {
          return {
            type: "day-sleep",
            label: "通宵后补觉",
            penalty: 18,
            tip: "这次记录呈现出通宵后补觉的时段特征。白天接触自然光、今晚避免继续推迟入睡，可能更有利于把作息拉回稳定范围。",
          };
        }
        if (startMinutes >= 120 && startMinutes < 300) {
          return {
            type: "late-night",
            label: "入睡偏晚",
            penalty: 8,
            tip: "入睡时间已经偏晚，身体可能睡够了但节律没完全跟上。明天可以先提前 20-30 分钟上床。",
          };
        }
        if (endMinutes >= 780 && endMinutes < 1080) {
          return {
            type: "late-wake",
            label: "起床偏晚",
            penalty: 6,
            tip: "起床时间偏晚，可能会影响今晚困意。下午尽量少睡长觉，给晚上的睡意留空间。",
          };
        }
        if (startMinutes >= 1260 || startMinutes < 90) {
          return {
            type: "night",
            label: "节律正常",
            penalty: -4,
            tip: "入睡时段比较友好，继续保持类似节奏会更容易看到分数进步。",
          };
        }
        return {
          type: "neutral",
          label: "节律可观察",
          penalty: 0,
          tip: "这次入睡时段不算极端，连续记录几天后再看趋势会更准。",
        };
      }

      function toMinutes(value) {
        if (!value) return null;
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      }

      function sleepHours(sleepTime, wakeTime) {
        const start = toMinutes(sleepTime);
        const end = toMinutes(wakeTime);
        if (start === null || end === null) return null;
        const minutes = end >= start ? end - start : 1440 - start + end;
        return minutes / 60;
      }

      function formatHours(value) {
        if (value === null || Number.isNaN(value)) return "--";
        const hours = Math.floor(value);
        const minutes = Math.round((value - hours) * 60);
        return `${hours}时${minutes ? `${minutes}分` : ""}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function numberOrBlank(value) {
        if (value === "") return "";
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : "";
      }

      function fillForm(dateKey) {
        const record = records[dateKey] || {};
        recordDateTitle.textContent = formatDay(dateKey);
        sleepInput.value = record.sleepTime || "";
        wakeInput.value = record.wakeTime || "";
        moodInput.value = record.mood || "";
        caffeineInput.value = record.caffeine ?? "";
        exerciseTypeInput.value = record.exerciseType || "";
        exerciseMinutesInput.value = record.exerciseMinutes ?? "";
        notesInput.value = record.notes || "";
        updateDuration();
        updateReport();
      }

      function collectForm() {
        const record = {
          date: dateInput.value,
          sleepTime: sleepInput.value,
          wakeTime: wakeInput.value,
          mood: moodInput.value,
          caffeine: numberOrBlank(caffeineInput.value),
          exerciseType: exerciseTypeInput.value.trim(),
          exerciseMinutes: numberOrBlank(exerciseMinutesInput.value),
          notes: notesInput.value.trim(),
          updatedAt: new Date().toISOString(),
        };
        record.wakeDate = wakeDateFor(record);
        return record;
      }

      function updateDuration() {
        durationEl.textContent = formatHours(sleepHours(sleepInput.value, wakeInput.value));
        sleepActionTime.textContent = sleepInput.value || "--:--";
        wakeActionTime.textContent = wakeInput.value || "--:--";
        updateActionState();
      }

      function updateActionState() {
        const complete = Boolean(sleepInput.value && wakeInput.value);
        const waitingForWake = Boolean(sleepInput.value && !wakeInput.value) || (!sleepInput.value && Boolean(latestOpenSleepRecord()));
        sleepActionPanel.classList.toggle("hidden", complete || waitingForWake);
        wakeActionPanel.classList.toggle("hidden", complete || !waitingForWake);
        timeCompleteState.classList.toggle("hidden", !complete);
        if (complete) {
          timeCompleteCopy.textContent = `${sleepInput.value} - ${wakeDateFor(collectForm()) !== dateInput.value ? "次日 " : ""}${wakeInput.value}`;
          actionHint.textContent = "已自动保存";
        } else if (waitingForWake) {
          actionHint.textContent = "完成这次睡眠记录";
        } else {
          actionHint.textContent = "开始这次睡眠记录";
        }
      }

      function setSaveStatus(message) {
        saveStatusEl.textContent = message;
      }

      function scheduleAutoSave() {
        setSaveStatus("正在保存…");
        window.clearTimeout(autoSaveTimer);
        autoSaveTimer = window.setTimeout(() => saveRecord(true), 350);
      }

      function playTone(kind = "tap") {
        if (!feedbackEnabled) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const now = audioContext.currentTime;
          const notes = kind === "success" ? [523.25, 659.25, 783.99] : [440, 587.33];
          notes.forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0.0001, now + index * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.08, now + index * 0.06 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.06 + 0.14);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(now + index * 0.06);
            oscillator.stop(now + index * 0.06 + 0.16);
          });
        } catch {
          // 有些浏览器会限制网页音频，失败时安静跳过。
        }
      }

      function haptic(pattern = [12]) {
        if (!feedbackEnabled || !navigator.vibrate) return;
        navigator.vibrate(pattern);
      }

      function feedback(kind = "tap") {
        haptic(kind === "success" ? [12, 30, 18] : [10]);
        playTone(kind);
      }

      function saveRecord(quiet = false) {
        const record = collectForm();
        if (!record.sleepTime && !record.wakeTime && !record.mood && !record.notes && !record.caffeine && !record.exerciseType && !record.exerciseMinutes) {
          showToast("还没有填写内容");
          return;
        }
        if (record.wakeTime && !record.sleepTime) {
          showToast("请先记录入睡时间");
          return false;
        }
        records[record.date] = record;
        persistRecords();
        updateAllViews();
        setSaveStatus("已保存");
        if (!quiet) {
          feedback("success");
          showToast("已生成睡眠报告");
        }
        return true;
      }

      function markSleepNow() {
        sleepInput.value = nowTime();
        saveRecord(true);
        showToast("已记录今天就到这吧");
      }

      function latestOpenSleepRecord() {
        const now = Date.now();
        return Object.values(records)
          .filter((record) => {
            if (!record.sleepTime || record.wakeTime) return false;
            if (record.updatedAt) return now - new Date(record.updatedAt).getTime() <= 48 * 60 * 60 * 1000;
            const dayGap = Math.abs(new Date(`${toDateKey(new Date())}T12:00:00`) - new Date(`${record.date}T12:00:00`));
            return dayGap <= 24 * 60 * 60 * 1000;
          })
          .sort((a, b) => String(b.updatedAt || b.date).localeCompare(String(a.updatedAt || a.date)))[0];
      }

      function recordWakeTime(value) {
        const currentRecord = records[dateInput.value];
        const currentHasContent = currentRecord && Object.values(currentRecord).some((item) => item !== "" && item !== null && item !== undefined);
        const pending = !sleepInput.value && !currentHasContent ? latestOpenSleepRecord() : null;
        if (pending && pending.date !== dateInput.value) {
          dateInput.value = pending.date;
          fillForm(pending.date);
        }
        if (!sleepInput.value) {
          wakeInput.value = "";
          updateAllViews();
          showToast("没有找到待完成的入睡记录");
          return { pending: null, saved: false };
        }
        const previousWakeTime = wakeInput.value;
        wakeInput.value = value;
        const duration = sleepHours(sleepInput.value, wakeInput.value);
        if (duration === 0) {
          wakeInput.value = previousWakeTime;
          updateAllViews();
          showToast("入睡和起床时间不能相同");
          return { pending, saved: false };
        }
        if (duration > 16 && !window.confirm(`这条记录约 ${formatHours(duration)}，时间可能填错了。仍要保存吗？`)) {
          wakeInput.value = previousWakeTime;
          updateAllViews();
          showToast("已保留原来的起床时间");
          return { pending, saved: false };
        }
        return { pending, saved: saveRecord(true) };
      }

      function markWakeNow() {
        const result = recordWakeTime(nowTime());
        if (!result.saved) return;
        showToast(result.pending ? "已和上次入睡记录合并" : "已记录我重生了");
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 1800);
      }

      function recentDays(count) {
        return Array.from({ length: count }, (_, index) => {
          const date = new Date();
          date.setDate(today.getDate() - (count - 1 - index));
          return toDateKey(date);
        });
      }

      function previousRecord(dateKey) {
        return Object.values(records)
          .filter((record) => record.date < dateKey && sleepHours(record.sleepTime, record.wakeTime) !== null)
          .sort((a, b) => b.date.localeCompare(a.date))[0];
      }

      function priorCompleteRecords(dateKey, count = 7) {
        return Object.values(records)
          .filter((record) => record.date < dateKey && sleepHours(record.sleepTime, record.wakeTime) !== null)
          .sort((a, b) => b.date.localeCompare(a.date))
          .slice(0, count);
      }

      function buildReport(record, includeDelta = true) {
        const hours = sleepHours(record.sleepTime, record.wakeTime);
        const factors = [];
        const completeness =
          (hours !== null ? 1 : 0) +
          (record.mood ? 1 : 0) +
          (record.caffeine !== "" && record.caffeine !== null && record.caffeine !== undefined ? 1 : 0) +
          (record.exerciseType || record.exerciseMinutes !== "" && record.exerciseMinutes !== null && record.exerciseMinutes !== undefined ? 1 : 0);
        if (hours === null) {
          return {
            score: 0,
            title: "等待完整记录",
            summary: "先完成今天记录：填进入睡和起床时间，我会帮你判断恢复、节律和影响因素。",
            tips: ["先记录一条就好，连续 7 天后就能看到自己的睡眠进步曲线。"],
            factors: ["未完成"],
            completeness,
            baselineCount: 0,
          };
        }

        let score = 65;
        const tips = [];
        const startMinutes = toMinutes(record.sleepTime);
        const endMinutes = toMinutes(record.wakeTime);
        const timing = sleepTiming(startMinutes, endMinutes);
        score -= timing.penalty;
        factors.push(timing.label);
        if (timing.tip) tips.push(timing.tip);

        if (hours >= 7 && hours <= 9) {
          score += 16;
          factors.push("时长理想");
        }
        if (hours < 6) {
          score -= 16;
          factors.push("睡眠偏短");
          tips.push("这次睡眠时间偏短，今晚别急着追求完美，先把入睡窗口提前 30 分钟就够了。");
        } else if (hours > 9.5) {
          score -= 5;
          factors.push("睡眠偏长");
          tips.push("睡眠时长偏长，如果醒来仍疲惫，可以观察是否睡眠质量不稳。");
        } else {
          tips.push("睡眠时长达标，这次主要看节律、咖啡因和精神状态。");
        }

        const caffeine = Number(record.caffeine || 0);
        if (caffeine > 200) {
          score -= 3;
          factors.push("咖啡因偏高");
          tips.push("记录到的咖啡因超过 200mg，但缺少摄入时间，无法判断它对这次入睡的具体影响。可以顺手观察是否集中在下午或晚上。");
        } else if (caffeine > 80) {
          score -= 1;
          factors.push("咖啡因适中");
          tips.push("记录到一定咖啡因摄入；如果它靠近睡前，可以再观察是否与入睡困难同时出现。");
        } else if (caffeine > 0) {
          factors.push("咖啡因较低");
          tips.push("这次记录的咖啡因总量较低，暂时不要仅凭一次记录判断影响。");
        }

        const exerciseMinutes = Number(record.exerciseMinutes || 0);
        if (exerciseMinutes >= 20 && exerciseMinutes <= 80) {
          score += 1;
          factors.push("记录了运动");
          tips.push(`记录了${record.exerciseType || "运动"} ${exerciseMinutes} 分钟；由于没有强度和时段信息，这里只作为观察因素。`);
        } else if (exerciseMinutes > 80) {
          factors.push("运动时长较长");
          tips.push("记录的运动时长较长，但缺少强度和时段信息，暂不据此判断对睡眠的影响。");
        }

        if (record.mood) {
          const moodValue = moodScore[record.mood] || 3;
          score += moodValue - 3;
          factors.push(`心情${record.mood}`);
          if (moodValue <= 2) tips.push("心情状态偏紧，睡前可以留 10 分钟做放松或写下明天要处理的事。");
        }

        score = Math.max(15, Math.min(95, Math.round(score)));
        const priorRecords = includeDelta ? priorCompleteRecords(record.date || dateInput.value) : [];
        let delta = null;
        if (priorRecords.length >= 3) {
          const baseline = priorRecords.reduce((sum, previous) => sum + buildReport(previous, false).score, 0) / priorRecords.length;
          delta = score - baseline;
          if (delta >= 5) tips.push(`比个人近 ${priorRecords.length} 次平均高 ${Math.round(delta)} 分，可以回看这次哪些习惯值得保留。`);
          if (delta <= -8) tips.push(`比个人近 ${priorRecords.length} 次平均低 ${Math.abs(Math.round(delta))} 分，先观察节律和时长，不用用单次分数定义状态。`);
        }

        const title =
          timing.type === "day-sleep"
            ? "这次更像补觉"
            : score >= 85
              ? "时长和时段较稳定"
              : score >= 70
                ? "记录条件较稳定"
                : score >= 55
                  ? "还有调整空间"
                  : "先从一件事开始调整";
        const exerciseText = record.exerciseType
          ? `${record.exerciseType}${exerciseMinutes ? ` ${exerciseMinutes} 分钟` : ""}`
          : "未记录运动";
        const caffeineText = record.caffeine === "" || record.caffeine === null || record.caffeine === undefined ? "咖啡因未记录" : `咖啡因 ${Math.round(caffeine)}mg`;
        const summary = `本次 ${timeLabel(record.sleepTime)} 到 ${timeLabel(record.wakeTime)}，睡了 ${formatHours(hours)}。${timing.type === "day-sleep" ? "这次记录呈现出通宵后补觉的时段特征。" : `${caffeineText}，${exerciseText}，心情${record.mood || "未选择"}。`}`;
        return {
          score,
          title,
          summary,
          tips: tips.slice(0, 4),
          factors: factors.slice(0, 4),
          delta,
          completeness,
          baselineCount: priorRecords.length,
        };
      }

      function updateReport() {
        const record = collectForm();
        const report = buildReport(record);
        reportCard.innerHTML = `
          <div class="report-score">
            <div>
              <p class="eyebrow">睡眠报告 · 记录参考分</p>
              <h2>${escapeHtml(report.title)}</h2>
            </div>
            <div class="ring" style="--score: ${report.score}">${report.score || "--"}</div>
          </div>
          <div class="report-copy">
            <p>${escapeHtml(report.summary)}</p>
            <ul>${report.tips.map((tip) => `<li>${escapeHtml(tip)}</li>`).join("")}</ul>
            <p class="report-basis">评分依据 ${report.completeness}/4 项。${report.baselineCount >= 3 ? `已与个人近 ${report.baselineCount} 次记录比较。` : "至少有 3 次历史后才与个人基线比较。"}参考分用于观察自己的记录变化，不是医疗诊断。</p>
          </div>
        `;
      }

      function updateOverview() {
        return;
      }

      function updateStats() {
        const days = recentDays(14);
        const recentRecords = days.map((day) => records[day]).filter(Boolean);
        const durations = recentRecords.map((record) => sleepHours(record.sleepTime, record.wakeTime)).filter((value) => value !== null);
        const caffeineValues = recentRecords
          .filter((record) => record.caffeine !== "" && record.caffeine !== null && record.caffeine !== undefined)
          .map((record) => Number(record.caffeine))
          .filter(Number.isFinite);
        const avgSleep = durations.length ? durations.reduce((sum, value) => sum + value, 0) / durations.length : null;
        const avgCaffeine = caffeineValues.length ? caffeineValues.reduce((sum, value) => sum + value, 0) / caffeineValues.length : null;
        const exerciseDays = recentRecords.filter((record) => Number(record.exerciseMinutes || 0) > 0 || record.exerciseType).length;
        document.querySelector("#avgSleep").textContent = avgSleep === null ? "--" : formatHours(avgSleep);
        document.querySelector("#avgCaffeine").textContent = avgCaffeine === null ? "--" : `${Math.round(avgCaffeine)}mg`;
        document.querySelector("#exerciseDays").textContent = `${exerciseDays}天`;
        document.querySelector("#trendNote").textContent =
          durations.length < 3
            ? `目前只有 ${durations.length} 条完整睡眠记录。至少记录 3 次后再判断变化，单次高低不代表长期趋势。`
            : `最近 14 天有 ${durations.length} 条完整记录。趋势用于观察自己的变化，不用于判断疾病或睡眠障碍。`;
      }

      function drawLineChart(canvas, series, options) {
        const ctx = canvas.getContext("2d");
        const width = canvas.width;
        const height = canvas.height;
        const pad = { top: 24, right: 18, bottom: 34, left: 48 };
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        const numericValues = series.flatMap((item) => item.values.map((point) => point.value)).filter(Number.isFinite);
        const maxValue = Math.max(options.max || 0, ...numericValues, 1);
        const plotHeight = height - pad.top - pad.bottom;
        const plotWidth = width - pad.left - pad.right;
        const yFor = (value) => pad.top + (1 - value / maxValue) * plotHeight;

        if (options.targetRange) {
          const [low, high] = options.targetRange;
          ctx.fillStyle = "rgba(208, 230, 253, 0.65)";
          ctx.fillRect(pad.left, yFor(high), plotWidth, yFor(low) - yFor(high));
        }

        ctx.strokeStyle = "#D0E6FD";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i += 1) {
          const y = pad.top + (plotHeight / 4) * i;
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(width - pad.right, y);
          ctx.stroke();
          ctx.fillStyle = "rgba(22, 38, 96, 0.58)";
          ctx.font = "18px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(String(Math.round(maxValue - (maxValue / 4) * i)), pad.left - 8, y + 6);
        }
        series.forEach((item) => {
          ctx.strokeStyle = item.color;
          ctx.fillStyle = item.color;
          ctx.lineWidth = 4;
          ctx.beginPath();
          let segmentStarted = false;
          item.values.forEach((point, index) => {
            if (!Number.isFinite(point.value)) {
              segmentStarted = false;
              return;
            }
            const x = pad.left + (plotWidth / Math.max(item.values.length - 1, 1)) * index;
            const y = yFor(point.value);
            if (!segmentStarted) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            segmentStarted = true;
          });
          ctx.stroke();
          item.values.forEach((point, index) => {
            if (!Number.isFinite(point.value)) return;
            const x = pad.left + (plotWidth / Math.max(item.values.length - 1, 1)) * index;
            const y = yFor(point.value);
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
          });
        });
        if (!numericValues.length) {
          ctx.fillStyle = "rgba(22, 38, 96, 0.58)";
          ctx.font = "20px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(options.emptyLabel || "暂无记录", width / 2, height / 2);
        }
        ctx.fillStyle = "#162660";
        ctx.font = "20px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "center";
        options.labels.forEach((label, index) => {
          if (![0, 4, 8, options.labels.length - 1].includes(index)) return;
          const rawX = pad.left + (plotWidth / Math.max(options.labels.length - 1, 1)) * index;
          const x = Math.min(Math.max(rawX, 34), width - 34);
          ctx.fillText(label, x, height - 8);
        });
        ctx.textAlign = "start";
      }

      function updateCharts() {
        const days = recentDays(14);
        const labels = days.map((day) => day.slice(5).replace("-", "/"));
        const sleepValues = days.map((day) => ({ value: sleepHours(records[day]?.sleepTime, records[day]?.wakeTime) }));
        const scoreValues = days.map((day) => ({
          value: sleepHours(records[day]?.sleepTime, records[day]?.wakeTime) === null ? null : buildReport(records[day], false).score,
        }));
        const caffeineValues = days.map((day) => {
          const value = records[day]?.caffeine;
          return { value: value === "" || value === null || value === undefined ? null : Number(value) };
        });
        drawLineChart(document.querySelector("#sleepChart"), [{ color: "#162660", values: sleepValues }], {
          labels,
          max: 12,
          targetRange: [7, 9],
          emptyLabel: "暂无完整睡眠记录",
        });
        drawLineChart(document.querySelector("#scoreChart"), [{ color: "#162660", values: scoreValues }], {
          labels,
          max: 100,
          emptyLabel: "暂无参考分记录",
        });
        drawLineChart(document.querySelector("#caffeineChart"), [{ color: "#162660", values: caffeineValues }], {
          labels,
          max: 400,
          emptyLabel: "暂无咖啡因记录",
        });
      }

      function updateHistory() {
        const selectedMonth = historyMonth.value;
        const months = [...new Set(Object.keys(records).map((date) => date.slice(0, 7)))].sort((a, b) => b.localeCompare(a));
        const previousSelection = historyMonth.value;
        historyMonth.innerHTML = `<option value="">全部月份</option>${months
          .map((month) => `<option value="${month}">${month.replace("-", "年")}月</option>`)
          .join("")}`;
        historyMonth.value = months.includes(previousSelection) ? previousSelection : "";
        const activeMonth = historyMonth.value;
        historyTitle.textContent = activeMonth ? `${Number(activeMonth.slice(5))}月记录` : "所有日子";
        const items = Object.values(records)
          .filter((record) => !activeMonth || record.date.startsWith(activeMonth))
          .sort((a, b) => b.date.localeCompare(a.date));
        if (!items.length) {
          historyList.innerHTML = `<div class="empty">${selectedMonth ? "这个月还没有记录。" : "还没有记录。今天先填一条就好。"}</div>`;
          return;
        }
        historyList.innerHTML = items
          .map((record) => {
            const duration = formatHours(sleepHours(record.sleepTime, record.wakeTime));
            const durationValue = sleepHours(record.sleepTime, record.wakeTime);
            const report = buildReport(record);
            const warning = durationValue === null ? "记录未完成" : durationValue > 16 ? "时长需复核" : "";
            const chips = [
              warning,
              duration !== "--" ? `睡眠 ${duration}` : "",
              record.mood ? record.mood : "",
              record.caffeine ? `${Math.round(Number(record.caffeine))}mg 咖啡因` : "",
              record.exerciseType ? `${record.exerciseType}${record.exerciseMinutes ? ` ${record.exerciseMinutes}分钟` : ""}` : "",
            ].filter(Boolean);
            return `
              <article class="history-item">
                <div class="history-top">
                  <div class="history-date">
                    <strong>${escapeHtml(formatDay(record.date))}</strong>
                    <small>${escapeHtml(timeLabel(record.sleepTime))} - ${wakeDateFor(record) !== record.date ? `次日 ` : ""}${escapeHtml(timeLabel(record.wakeTime))}</small>
                  </div>
                  <div class="score-badge">${report.score || "--"}</div>
                </div>
                <div class="history-chips">
                  ${chips.map((chip) => `<span class="chip${chip === warning && warning ? " warning" : ""}">${escapeHtml(chip)}</span>`).join("")}
                </div>
                <p class="history-note">${escapeHtml(report.title)}：${escapeHtml(report.tips[0] || report.summary)}</p>
                <button class="history-edit" type="button" data-date="${escapeHtml(record.date)}">查看或修改</button>
              </article>
            `;
          })
          .join("");
      }

      function updateAllViews() {
        updateDuration();
        updateOverview();
        updateReport();
        updateStats();
        updateCharts();
        updateHistory();
      }

      document.querySelector("#quickSleepBtn").addEventListener("click", () => {
        feedback("tap");
        markSleepNow();
      });

      document.querySelector("#quickWakeBtn").addEventListener("click", () => {
        feedback("tap");
        markWakeNow();
      });

      [sleepInput, wakeInput].forEach((input) => {
        input.addEventListener("input", () => {
          updateDuration();
          updateReport();
        });
      });

      [moodInput, caffeineInput, exerciseTypeInput, exerciseMinutesInput, notesInput].forEach((input) => {
        input.addEventListener("input", () => {
          updateReport();
          scheduleAutoSave();
        });
      });

      sleepInput.addEventListener("change", () => {
        saveRecord(true);
        showToast("已更新入睡时间");
      });

      wakeInput.addEventListener("change", () => {
        const selectedTime = wakeInput.value;
        const result = recordWakeTime(selectedTime);
        if (!result.saved) return;
        showToast(result.pending ? "已和上次入睡记录合并" : "已更新起床时间");
      });

      dateInput.addEventListener("change", () => {
        window.clearTimeout(autoSaveTimer);
        fillForm(dateInput.value);
        setSaveStatus("自动保存");
      });

      document.querySelectorAll(".nav-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.target;
          document.querySelectorAll(".panel").forEach((panel) => panel.classList.toggle("hidden", panel.dataset.view !== target));
          reportCard.classList.toggle("hidden", target !== "today");
          document.querySelectorAll(".nav-btn").forEach((navButton) => navButton.classList.toggle("active", navButton === button));
          updateAllViews();
        });
      });

      document.querySelector("#exportBtn").addEventListener("click", exportRecords);
      document.querySelector("#importBtn").addEventListener("click", () => importInput.click());
      importInput.addEventListener("change", () => importRecords(importInput.files[0]));

      historyList.addEventListener("click", (event) => {
        const editButton = event.target.closest(".history-edit");
        if (!editButton) return;
        dateInput.value = editButton.dataset.date;
        fillForm(editButton.dataset.date);
        document.querySelector('.nav-btn[data-target="today"]').click();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      historyMonth.addEventListener("change", updateHistory);

      document.querySelector("#clearBtn").addEventListener("click", () => {
        const confirmed = window.confirm("确认清空所有记录吗？这个操作不能恢复。建议先导出备份。");
        if (!confirmed) return;
        records = {};
        persistRecords();
        fillForm(dateInput.value);
        updateAllViews();
        showToast("已清空");
      });

      dateInput.value = toDateKey(today);
      todayLabel.textContent = new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long",
      }).format(today);
      fillForm(dateInput.value);
      updateAllViews();

      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            // 离线能力注册失败不应阻断本地记录。
          });
        });
      }
    </script>
  </body>
</html>
